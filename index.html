<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StorageOS · Warehouse Management</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* Vibrant navy palette (EFI-style) */
  --bg-body:#0f1e3d;
  --bg-panel:#16274d;
  --bg-elev:#1e3160;
  --bg-hover:#263e75;
  --border:rgba(148,163,184,.12);
  --border-strong:rgba(148,163,184,.24);
  /* Logistics orange (primary CTA) */
  --brand:#f97316;
  --brand-dark:#ea580c;
  --brand-soft:rgba(249,115,22,.12);
  /* Steel blue (secondary) */
  --steel:#3b82f6;
  --steel-dark:#2563eb;
  /* Text */
  --text:#e2e8f0;--text2:#94a3b8;--text3:#94a3b8;
  /* Status */
  --green:#10b981;--red:#ef4444;--yellow:#f59e0b;--purple:#a855f7;
}
html,body{background:var(--bg-body);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;font-size:13px;line-height:1.5;}
input,select,textarea{background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:6px;color:var(--text);padding:8px 11px;font-size:12px;width:100%;outline:none;font-family:inherit;}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(249,115,22,.15);}
button{cursor:pointer;border:none;border-radius:6px;font-size:12px;font-weight:600;padding:8px 14px;transition:.15s;font-family:inherit;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-steel{background:var(--steel);color:#fff;}
.btn-steel:hover{background:var(--steel-dark);}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border-strong);}
.btn-ghost:hover{background:var(--bg-hover);color:var(--text);}
.btn-danger{background:rgba(239,68,68,.10);color:#ef4444;border:1px solid rgba(239,68,68,.28);}
.btn-danger:hover{background:rgba(239,68,68,.18);}
.btn-icon{padding:5px 8px;font-size:11px;}
label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);display:block;margin-bottom:4px;}

.ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.ico-sm{width:14px;height:14px;}
.ico-lg{width:20px;height:20px;}

#loginOverlay{position:fixed;inset:0;background:radial-gradient(ellipse at top,#1e3160 0%,#0f1e3d 60%);display:flex;align-items:center;justify-content:center;z-index:9999;}
.login-box{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:36px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative;overflow:hidden;}
.login-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--green),#22d3ee);}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.login-brand-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;}
.login-box h1{font-size:19px;font-weight:800;letter-spacing:-.02em;}
.login-box h1 .accent{color:var(--brand);}
.login-box p{font-size:11px;color:var(--text3);margin-bottom:24px;text-transform:uppercase;letter-spacing:.08em;}
.login-box .field{margin-bottom:14px;}
.login-error{color:#ef4444;font-size:11px;margin-top:8px;display:none;}

.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}

.sidebar{background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;position:relative;}
.sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--green),#22d3ee);z-index:2;}
.sb-brand{padding:18px 18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.sb-brand-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.sb-brand-txt h2{font-size:14px;font-weight:800;letter-spacing:-.01em;line-height:1.2;}
.sb-brand-txt small{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;font-weight:600;}
.sb-section{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);padding:14px 18px 6px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;border-left:3px solid transparent;transition:.15s;}
.sb-item:hover{background:var(--bg-hover);color:var(--text);}
.sb-item.active{background:var(--brand-soft);color:var(--brand);border-left-color:var(--brand);font-weight:600;}
.sb-item .ico{width:15px;height:15px;}
.sb-footer{margin-top:auto;padding:12px 18px;border-top:1px solid var(--border);}
.sb-user{display:flex;align-items:center;gap:10px;padding:6px;border-radius:6px;cursor:pointer;transition:.15s;}
.sb-user:hover{background:var(--bg-hover);}
.sb-user .avatar{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--steel),var(--brand));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;}
.sb-user .u-name{font-size:12px;font-weight:600;line-height:1.2;}
.sb-user .u-rol{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;}

.main-wrap{display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:var(--bg-panel);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;padding:0 20px;gap:16px;position:relative;}
.topbar::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--green),#22d3ee);}
.topbar-crumb{font-size:12px;color:var(--text3);}
.topbar-crumb strong{color:var(--text);}
.topbar-search{flex:1;max-width:320px;position:relative;}
.topbar-search input{padding:7px 11px 7px 34px;font-size:12px;}
.topbar-search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.topbar-badge{background:var(--bg-elev);padding:5px 10px;border-radius:14px;font-size:10px;color:var(--text2);display:flex;align-items:center;gap:6px;}
.topbar-badge .dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}

.main{padding:20px 24px;max-width:1600px;margin:0 auto;width:100%;}
.page-header{margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.page-title{font-size:18px;font-weight:700;margin-bottom:2px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
.page-title .ico{color:var(--brand);}
.page-sub{font-size:12px;color:var(--text3);}

/* Section dividers for tipo Almacen/Predio */
.section-divider{display:flex;align-items:center;gap:10px;margin:14px 0 12px;padding:0 2px;}
.section-divider-line{flex:1;height:1px;background:linear-gradient(90deg,var(--border-strong),transparent);}
.section-divider-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--text2);display:flex;align-items:center;gap:8px;}
.section-divider-title .ico{color:var(--brand);width:14px;height:14px;}
.section-divider-count{background:var(--bg-elev);color:var(--text2);padding:3px 10px;border-radius:12px;font-size:10px;font-weight:600;}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--brand);}
.kpi.steel::before{background:var(--steel);}
.kpi.green::before{background:var(--green);}
.kpi.red::before{background:var(--red);}
.kpi.yellow::before{background:var(--yellow);}
.kpi.purple::before{background:var(--purple);}
.kpi-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.kpi-icon{width:26px;height:26px;background:var(--brand-soft);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--brand);}
.kpi.steel .kpi-icon{background:rgba(59,130,246,.12);color:var(--steel);}
.kpi.green .kpi-icon{background:rgba(16,185,129,.12);color:var(--green);}
.kpi.red .kpi-icon{background:rgba(239,68,68,.12);color:var(--red);}
.kpi.yellow .kpi-icon{background:rgba(245,158,11,.12);color:var(--yellow);}
.kpi.purple .kpi-icon{background:rgba(168,85,247,.12);color:var(--purple);}
.kpi-val{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
.kpi-lbl{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}

/* Compact KPI variant for contract subdivisions */
.kpi-sub{display:flex;flex-direction:column;gap:2px;margin-top:4px;padding-top:6px;border-top:1px solid var(--border);}
.kpi-sub-row{display:flex;justify-content:space-between;align-items:center;font-size:10px;}
.kpi-sub-row .lbl{color:var(--text3);}
.kpi-sub-row .val{font-weight:700;color:var(--text);}
.kpi-sub-row.warn .val{color:var(--yellow);}
.kpi-sub-row.err .val{color:var(--red);}

.card{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px;}
.card-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.card-header h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;letter-spacing:-.01em;}
.card-header h3 .ico{color:var(--brand);}
.card-header .count{font-size:11px;color:var(--text3);font-weight:500;}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead tr{background:rgba(30,49,96,.5);}
th{padding:8px 14px;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;color:var(--text3);letter-spacing:.08em;white-space:nowrap;}
td{padding:9px 14px;font-size:12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(30,49,96,.35);}
.actions{display:flex;gap:4px;justify-content:flex-end;}

.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.badge-green{background:rgba(16,185,129,.15);color:var(--green);}
.badge-red{background:rgba(239,68,68,.15);color:var(--red);}
.badge-yellow{background:rgba(245,158,11,.15);color:var(--yellow);}
.badge-steel{background:rgba(59,130,246,.15);color:var(--steel);}

.modal-overlay{position:fixed;inset:0;background:rgba(10,20,45,.88);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;width:100%;max-width:900px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 70px rgba(0,0,0,.5);}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-header h3{font-size:14px;font-weight:700;}
.modal-body{padding:20px;}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-field{margin-bottom:12px;}

.empty{padding:44px;text-align:center;color:var(--text3);font-size:12px;}
.loading{padding:44px;text-align:center;color:var(--text3);font-size:12px;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:8px;padding:12px 16px;font-size:12px;z-index:9999;display:none;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.4);}
.toast.show{display:block;animation:slideUp .3s ease;}
.toast.success{border-color:rgba(16,185,129,.5);color:var(--green);}
.toast.error{border-color:rgba(239,68,68,.5);color:var(--red);}
.toast.info{border-color:rgba(59,130,246,.5);color:var(--steel);}
@keyframes slideUp{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
.session-status{position:fixed;bottom:8px;left:14px;font-size:9px;color:var(--text3);z-index:100;opacity:.5;}

/* Floor plan - fix: quitar border-top que causaba línea cruzada */
.floor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:16px;}
.floor-cell{background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;padding:12px;position:relative;overflow:hidden;cursor:pointer;transition:.15s;}
.floor-cell:hover{border-color:var(--brand);transform:translateY(-1px);}
.floor-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,transparent 30%,rgba(16,185,129,.14));transition:.3s;pointer-events:none;}
.floor-cell.yellow .floor-fill{background:linear-gradient(180deg,transparent 30%,rgba(245,158,11,.14));}
.floor-cell.red .floor-fill{background:linear-gradient(180deg,transparent 30%,rgba(239,68,68,.18));}
.floor-content{position:relative;z-index:1;}
.floor-name{font-size:12px;font-weight:700;margin-bottom:2px;}
.floor-loc{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.floor-tipo{position:absolute;top:10px;right:10px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:3px;background:rgba(59,130,246,.15);color:var(--steel);}
.floor-cell[data-tipo="predio"] .floor-tipo{background:rgba(168,85,247,.15);color:var(--purple);}
.floor-stats{display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-bottom:6px;}
.floor-pct{font-size:18px;font-weight:800;letter-spacing:-.02em;}
.floor-cell.green .floor-pct{color:var(--green);}
.floor-cell.yellow .floor-pct{color:var(--yellow);}
.floor-cell.red .floor-pct{color:var(--red);}
.floor-bar{height:4px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;margin-top:6px;}
.floor-bar-fill{height:100%;background:var(--green);transition:.3s;}
.floor-cell.yellow .floor-bar-fill{background:var(--yellow);}
.floor-cell.red .floor-bar-fill{background:var(--red);}

.linea-bod{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px;padding:10px;background:var(--bg-elev);border-radius:8px;}

.topbar-bell{position:relative;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--bg-elev);border-radius:8px;color:var(--text2);transition:.15s;}
.topbar-bell:hover{background:var(--bg-hover);color:var(--brand);}
.bell-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:9px;font-weight:800;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg-panel);}
.alert-item{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.alert-item:last-child{border-bottom:none;}
.alert-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.alert-icon.red{background:rgba(239,68,68,.15);color:var(--red);}
.alert-icon.yellow{background:rgba(245,158,11,.15);color:var(--yellow);}
.alert-body{flex:1;min-width:0;}
.alert-title{font-size:12px;font-weight:700;margin-bottom:2px;}
.alert-sub{font-size:11px;color:var(--text3);}
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="login-box">
    <div class="login-brand">
      <div class="login-brand-icon">
        <svg class="ico ico-lg" viewBox="0 0 24 24"><path d="M22 8.35V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.35A2 2 0 0 1 3.26 6.5l8-3.2a2 2 0 0 1 1.48 0l8 3.2A2 2 0 0 1 22 8.35Z"/><path d="M6 18h12"/><path d="M6 14h12"/><rect x="6" y="10" width="12" height="12"/></svg>
      </div>
      <div>
        <h1>Storage<span class="accent">OS</span></h1>
        <p>Warehouse Management</p>
      </div>
    </div>
    <div class="field"><label>Correo electrónico</label><input type="email" id="loginEmail" placeholder="usuario@empresa.com"/></div>
    <div class="field"><label>Contraseña</label><input type="password" id="loginPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/></div>
    <button class="btn-primary" style="width:100%;margin-top:6px;padding:11px;" onclick="login()">Ingresar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="shell" id="app" style="display:none;">
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="sb-brand-icon">
        <svg class="ico ico-lg" viewBox="0 0 24 24"><path d="M22 8.35V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.35A2 2 0 0 1 3.26 6.5l8-3.2a2 2 0 0 1 1.48 0l8 3.2A2 2 0 0 1 22 8.35Z"/><path d="M6 18h12"/><path d="M6 14h12"/><rect x="6" y="10" width="12" height="12"/></svg>
      </div>
      <div class="sb-brand-txt">
        <h2>StorageOS</h2>
        <small>Warehouse Management</small>
      </div>
    </div>
    <div class="sb-section">Operación</div>
    <div class="sb-item active" data-page="dashboard" onclick="navTo('dashboard')">
      <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      Dashboard
    </div>
    <div class="sb-item" data-page="bodegas" onclick="navTo('bodegas')">
      <svg class="ico" viewBox="0 0 24 24"><path d="M22 8.35V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.35A2 2 0 0 1 3.26 6.5l8-3.2a2 2 0 0 1 1.48 0l8 3.2A2 2 0 0 1 22 8.35Z"/><path d="M6 18h12"/><path d="M6 14h12"/><path d="M6 10h12"/></svg>
      Bodegas
    </div>
    <div class="sb-item" data-page="ocupaciones" onclick="navTo('ocupaciones')">
      <svg class="ico" viewBox="0 0 24 24"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
      Ocupaciones
    </div>
    <div class="sb-section">Comercial</div>
    <div class="sb-item" data-page="clientes" onclick="navTo('clientes')">
      <svg class="ico" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Clientes
    </div>
    <div class="sb-item" data-page="contratos" onclick="navTo('contratos')">
      <svg class="ico" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Contratos
    </div>
    <div class="sb-section">Análisis</div>
    <div class="sb-item" data-page="proyeccion" onclick="navTo('proyeccion')">
      <svg class="ico" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
      Proyección
    </div>

    <div class="sb-footer">
      <div class="sb-user" onclick="logout()">
        <div class="avatar" id="uAvatar">W</div>
        <div style="flex:1;min-width:0;">
          <div class="u-name" id="uName">Usuario</div>
          <div class="u-rol">Administrador</div>
        </div>
        <svg class="ico" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
    </div>
  </aside>

  <div class="main-wrap">
    <div class="topbar">
      <div class="topbar-crumb">Módulo: <strong id="crumb">Dashboard</strong></div>
      <div class="topbar-search">

function ico(name, cls){ return '<svg class="ico'+(cls?' '+cls:'')+'" viewBox="0 0 24 24">'+(ICO[name]||'')+'</svg>'; }

function saveSession(){localStorage.setItem('_jwt',_jwt);localStorage.setItem('_refreshToken',_refreshToken);localStorage.setItem('_user',JSON.stringify(_user));updateSessionStatus(true);}
function loadSession(){_jwt=localStorage.getItem('_jwt');_refreshToken=localStorage.getItem('_refreshToken');var s=localStorage.getItem('_user');if(s){try{_user=JSON.parse(s);}catch(e){}}return!!(_jwt&&_refreshToken);}
function clearSession(){_jwt=null;_refreshToken=null;_user=null;['_jwt','_refreshToken','_user'].forEach(function(k){localStorage.removeItem(k);});if(_refreshInterval)clearInterval(_refreshInterval);updateSessionStatus(false);}
async function refreshToken(){if(!_refreshToken)return false;try{var res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:_refreshToken})});if(!res.ok)return false;var d=await res.json();if(d.access_token){_jwt=d.access_token;if(d.refresh_token)_refreshToken=d.refresh_token;saveSession();console.log('✓ Token renovado');return true;}}catch(e){console.error(e);}return false;}
function startRefreshInterval(){if(_refreshInterval)clearInterval(_refreshInterval);_refreshInterval=setInterval(async function(){var ok=await refreshToken();if(!ok){toast('Sesión expirada','error');logout();}},50*60*1000);}
function updateSessionStatus(active){var el=document.getElementById('sessionStatus');el.textContent=active?'● Sesión activa':'○ Sin sesión';el.style.color=active?'var(--green)':'var(--red)';}
function sbh(extra){var h={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+(_jwt||SUPABASE_KEY),'Content-Type':'application/json'};if(extra)Object.assign(h,extra);return h;}
async function sbFetch(path,opts,retry){retry=retry||0;var o=Object.assign({},opts);o.headers=sbh(opts&&opts.headers);var res=await fetch(SUPABASE_URL+path,o);if(res.status===401&&retry<2){if(_isRefreshing){await _refreshPromise;await new Promise(r=>setTimeout(r,500));return sbFetch(path,opts,retry+1);}_isRefreshing=true;_refreshPromise=refreshToken();var ok=await _refreshPromise;_isRefreshing=false;if(ok){await new Promise(r=>setTimeout(r,300));o.headers=sbh(opts&&opts.headers);res=await fetch(SUPABASE_URL+path,o);}else{logout();return res;}}return res;}

async function login(){
  var email=document.getElementById('loginEmail').value.trim();
  var pass=document.getElementById('loginPassword').value;
  var errEl=document.getElementById('loginError');errEl.style.display='none';
  if(!email||!pass){errEl.textContent='Ingresá email y contraseña.';errEl.style.display='block';return;}
  try{
    var res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    var d=await res.json();
    if(!res.ok||!d.access_token)throw new Error(d.error_description||d.msg||'Error de autenticación');
    _jwt=d.access_token;_refreshToken=d.refresh_token;_user=d.user;
    saveSession();startRefreshInterval();showApp();
    toast('¡Sesión iniciada!','success');navTo('dashboard');cargarAlertas();setInterval(cargarAlertas,5*60*1000);
  }catch(e){errEl.textContent=e.message;errEl.style.display='block';}
}
function logout(){clearSession();document.getElementById('loginOverlay').style.display='flex';document.getElementById('app').style.display='none';document.getElementById('loginEmail').value='';document.getElementById('loginPassword').value='';}
function showApp(){
  document.getElementById('loginOverlay').style.display='none';
  document.getElementById('app').style.display='grid';
  if(_user&&_user.email){var name=_user.email.split('@')[0];document.getElementById('uName').textContent=name;document.getElementById('uAvatar').textContent=name[0].toUpperCase();}
}

function fmt(n){return(parseFloat(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtInt(n){return Math.round(parseFloat(n)||0).toLocaleString('en-US');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
async function confirmar(msg){return new Promise(function(resolve){openModal('Confirmar','<p style="color:var(--text2);line-height:1.6;">'+esc(msg)+'</p>','<button class="btn-ghost" onclick="closeModal();window._confRes(false);">Cancelar</button><button class="btn-danger" onclick="closeModal();window._confRes(true);">Eliminar</button>');window._confRes=resolve;});}

// ═══════════════════════════════════════════════════════════════
// DASHBOARD — dividido por tipo (Almacenes / Predios)
// ═══════════════════════════════════════════════════════════════
async function renderDashboard(){
  document.getElementById('mainArea').innerHTML='<div class="loading">Cargando dashboard...</div>';
  try{
    var [rB,rCB,rC,rCli]=await Promise.all([
      sbFetch('/rest/v1/bodegas?select=*&order=nombre.asc&limit=10000'),
      sbFetch('/rest/v1/contrato_bodegas?select=*&limit=10000'),
      sbFetch('/rest/v1/contratos?select=*&limit=10000'),
      sbFetch('/rest/v1/clientes_almacen?select=id&limit=1',{headers:{'Prefer':'count=exact','Range':'0-0'}})
    ]);
    var bodegas=await rB.json();if(!Array.isArray(bodegas))bodegas=[];
    var cb=await rCB.json();if(!Array.isArray(cb))cb=[];
    var contratos=await rC.json();if(!Array.isArray(contratos))contratos=[];
    var contMap={};contratos.forEach(function(c){contMap[c.id]=c;});
    var bodMap={};bodegas.forEach(function(b){bodMap[b.id]=b;});
    var activosCB=cb.filter(function(r){var c=contMap[r.contrato_id];return c&&c.activo!==false;});

    // ═══ Cálculo de contratos: activos / vencidos / por vencer 90d ═══
    var hoy=new Date();hoy.setHours(0,0,0,0);
    var en90=new Date();en90.setHours(0,0,0,0);en90.setDate(en90.getDate()+90);
    var contActivos=0,contPorVencer=0,contVencidos=0;
    contratos.forEach(function(c){
      if(c.activo===false)return;
      var fin=c.fecha_fin?new Date(c.fecha_fin):null;
      if(fin){fin.setHours(0,0,0,0);}
      if(fin && fin < hoy){contVencidos++;}
      else if(fin && fin <= en90){contPorVencer++;contActivos++;}
      else{contActivos++;}
    });

    // ═══ Función para calcular métricas por tipo ═══
    function metricasPorTipo(tipo){
      var bods=bodegas.filter(function(b){return (b.tipo||'almacen')===tipo;});
      var bodIds={};bods.forEach(function(b){bodIds[b.id]=true;});
      var totalMts2=bods.reduce(function(a,b){return a+parseFloat(b.mts2_totales||0);},0);
      var cbTipo=activosCB.filter(function(r){return bodIds[r.bodega_id];});
      var mts2Util=cbTipo.reduce(function(a,r){return a+parseFloat(r.mts2||0);},0);
      var mts2Disp=totalMts2-mts2Util;
      var costoAlq=cbTipo.reduce(function(a,r){var b=bodMap[r.bodega_id];return a+(parseFloat(r.mts2||0)*(b?parseFloat(b.valor_m2_alquiler||0):0));},0);
      var ingresos=cbTipo.reduce(function(a,r){return a+(parseFloat(r.mts2||0)*parseFloat(r.valor_m2||0));},0);
      // Clientes únicos con CB en este tipo
      var cliSet={};
      cbTipo.forEach(function(r){var c=contMap[r.contrato_id];if(c&&c.cliente_id)cliSet[c.cliente_id]=true;});
      // Contratos únicos con CB en este tipo
      var contSet={};
      cbTipo.forEach(function(r){contSet[r.contrato_id]=true;});
      return {
        cantidad: bods.length,
        totalMts2: totalMts2,
        mts2Util: mts2Util,
        mts2Disp: mts2Disp,
        costoAlq: costoAlq,
        ingresos: ingresos,
        utilidad: ingresos-costoAlq,
        clientes: Object.keys(cliSet).length,
        contratos: Object.keys(contSet).length
      };
    }

    var almc=metricasPorTipo('almacen');
    var prds=metricasPorTipo('predio');

    // ═══ KPI Section builder ═══
    function kpiSection(m, isPredio){
      return '<div class="kpi-grid">'+
        '<div class="kpi steel"><div class="kpi-head"><div class="kpi-icon">'+ico('ruler')+'</div></div><div class="kpi-val">'+fmtInt(m.totalMts2)+'</div><div class="kpi-lbl">M² Totales</div></div>'+
        '<div class="kpi purple"><div class="kpi-head"><div class="kpi-icon">'+ico('package')+'</div></div><div class="kpi-val">'+fmtInt(m.mts2Util)+'</div><div class="kpi-lbl">M² Utilizados</div></div>'+
        '<div class="kpi green"><div class="kpi-head"><div class="kpi-icon">'+ico('check')+'</div></div><div class="kpi-val">'+fmtInt(m.mts2Disp)+'</div><div class="kpi-lbl">M² Disponibles</div></div>'+
        '<div class="kpi red"><div class="kpi-head"><div class="kpi-icon">'+ico('cash')+'</div></div><div class="kpi-val">$'+fmt(m.costoAlq)+'</div><div class="kpi-lbl">Costo Alquiler</div></div>'+
        '<div class="kpi"><div class="kpi-head"><div class="kpi-icon">'+ico('cash')+'</div></div><div class="kpi-val">$'+fmt(m.ingresos)+'</div><div class="kpi-lbl">Ingreso Venta</div></div>'+
        '<div class="kpi yellow"><div class="kpi-head"><div class="kpi-icon">'+ico('trend')+'</div></div><div class="kpi-val">$'+fmt(m.utilidad)+'</div><div class="kpi-lbl">Utilidad Mensual</div></div>'+
        '<div class="kpi steel"><div class="kpi-head"><div class="kpi-icon">'+ico('users')+'</div></div><div class="kpi-val">'+fmtInt(m.clientes)+'</div><div class="kpi-lbl">Clientes</div></div>'+
        '<div class="kpi"><div class="kpi-head"><div class="kpi-icon">'+ico('contract')+'</div></div><div class="kpi-val">'+fmtInt(m.contratos)+'</div><div class="kpi-lbl">Contratos Activos</div>'+
          '<div class="kpi-sub">'+
            '<div class="kpi-sub-row warn"><span class="lbl">Por vencer 90d</span><span class="val">'+fmtInt(contPorVencer)+'</span></div>'+
            '<div class="kpi-sub-row err"><span class="lbl">Vencidos</span><span class="val">'+fmtInt(contVencidos)+'</span></div>'+
          '</div>'+
        '</div>'+
      '</div>';
    }

    // ═══ Planta ═══
    function planta(bods){
      return bods.map(function(b){
        var util = activosCB.filter(function(r){return r.bodega_id===b.id;}).reduce(function(a,r){return a+parseFloat(r.mts2||0);},0);
        var tot = parseFloat(b.mts2_totales||0);
        var pct = tot>0 ? Math.round((util/tot)*100) : 0;
        var estado = pct>=90 ? 'red' : pct>=60 ? 'yellow' : 'green';
        var fillH = Math.min(pct, 100);
        var tipoLbl = (b.tipo||'almacen')==='predio' ? 'Predio' : 'Almacén';
        return '<div class="floor-cell '+estado+'" data-tipo="'+(b.tipo||'almacen')+'" onclick="verDetalleBodega('+b.id+')">'+
          '<span class="floor-tipo">'+tipoLbl+'</span>'+
          '<div class="floor-fill" style="height:'+fillH+'%;"></div>'+
          '<div class="floor-content">'+
            '<div class="floor-name">'+esc(b.nombre)+'</div>'+
            '<div class="floor-loc">'+esc(b.ubicacion||'—')+'</div>'+
            '<div class="floor-pct">'+pct+'%</div>'+
            '<div class="floor-stats"><span>'+fmtInt(util)+' m² usados</span><span>'+fmtInt(tot-util)+' m² libres</span></div>'+
            '<div class="floor-bar"><div class="floor-bar-fill" style="width:'+fillH+'%;"></div></div>'+
          '</div>'+
        '</div>';
      }).join('');
    }
    var almBods = bodegas.filter(function(b){return (b.tipo||'almacen')==='almacen';});
    var prdBods = bodegas.filter(function(b){return (b.tipo||'almacen')==='predio';});

    // ═══ Detalle tabla ═══
    function detalleFilas(bods){
      return bods.map(function(b){
        var util=activosCB.filter(function(r){return r.bodega_id===b.id;}).reduce(function(a,r){return a+parseFloat(r.mts2||0);},0);
        var tot=parseFloat(b.mts2_totales||0);
        var disp=tot-util;
        var pct=tot>0?Math.round((util/tot)*100):0;
        var badge=pct>=90?'red':pct>=60?'yellow':'green';
        return '<tr style="cursor:pointer;" onclick="verDetalleBodega('+b.id+')" title="Ver detalle"><td><strong>'+esc(b.nombre)+'</strong></td>'+
          '<td>'+esc(b.ubicacion||'—')+'</td>'+
          '<td>'+fmtInt(tot)+' m²</td>'+
          '<td>'+fmtInt(util)+' m²</td>'+
          '<td>'+fmtInt(disp)+' m²</td>'+
          '<td>$'+fmt(b.valor_m2_alquiler||0)+'</td>'+
          '<td><span class="badge badge-'+badge+'">'+pct+'%</span></td></tr>';
      }).join('');
    }

    document.getElementById('mainArea').innerHTML =
      '<div class="page-header">'+
        '<div><div class="page-title">'+ico('dashboard','ico-lg')+' Dashboard</div>'+
        '<div class="page-sub">Panorama general del centro de distribución</div></div>'+
      '</div>'+
      // ALMACENES
      '<div class="section-divider">'+
        '<div class="section-divider-title">'+ico('warehouse')+' Almacenes</div>'+
        '<div class="section-divider-count">'+almc.cantidad+' unidades</div>'+
        '<div class="section-divider-line"></div>'+
      '</div>'+
      kpiSection(almc, false)+
      // PREDIOS
      '<div class="section-divider">'+
        '<div class="section-divider-title">'+ico('land')+' Predios</div>'+
        '<div class="section-divider-count">'+prds.cantidad+' unidades</div>'+
        '<div class="section-divider-line"></div>'+
      '</div>'+
      kpiSection(prds, true)+
      // PLANTA
      '<div class="card">'+
        '<div class="card-header"><h3>'+ico('warehouse')+' Planta del Centro de Distribución</h3><span class="count">'+bodegas.length+' bodegas · Click para detalle</span></div>'+
        (almBods.length>0 ? '<div style="padding:12px 16px 0;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;">Almacenes</div><div class="floor-grid">'+planta(almBods)+'</div>' : '')+
        (prdBods.length>0 ? '<div style="padding:12px 16px 0;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;border-top:1px solid var(--border);margin-top:8px;">Predios</div><div class="floor-grid">'+planta(prdBods)+'</div>' : '')+
      '</div>'+
      // DETALLE
      '<div class="card">'+
        '<div class="card-header"><h3>'+ico('chart')+' Detalle por Bodega</h3></div>'+
        '<div class="table-wrap"><table><thead><tr><th>Bodega</th><th>Ubicación</th><th>Total M²</th><th>Utilizados</th><th>Disponibles</th><th>Valor/m²</th><th>Ocupación</th></tr></thead><tbody>'+
        detalleFilas(bodegas)+
        '</tbody></table></div></div>';
  }catch(e){toast('Error: '+e.message,'error');document.getElementById('mainArea').innerHTML='<div class="empty">Error cargando datos</div>';}
}

// ═══ DETALLE BODEGA ═══
async function verDetalleBodega(bodegaId){
  try{
    var [rB,rCB,rC,rCli]=await Promise.all([
      sbFetch('/rest/v1/bodegas?id=eq.'+bodegaId),
      sbFetch('/rest/v1/contrato_bodegas?bodega_id=eq.'+bodegaId+'&limit=1000'),
      sbFetch('/rest/v1/contratos?select=id,codigo,activo,cliente_id,fecha_inicio,fecha_fin&limit=10000'),
      sbFetch('/rest/v1/clientes_almacen?select=id,razon_social&limit=10000')
    ]);
    var bod=(await rB.json())[0]||{};
    var cbs=await rCB.json();if(!Array.isArray(cbs))cbs=[];
    var contratos=await rC.json();if(!Array.isArray(contratos))contratos=[];
    var clientes=await rCli.json();if(!Array.isArray(clientes))clientes=[];
    var contMap={};contratos.forEach(function(c){contMap[c.id]=c;});
    var cliMap={};clientes.forEach(function(c){cliMap[c.id]=c;});
    var totalOcup=cbs.reduce(function(a,r){var c=contMap[r.contrato_id];return c&&c.activo!==false?a+parseFloat(r.mts2||0):a;},0);
    var tot=parseFloat(bod.mts2_totales||0);
    var body='<div style="margin-bottom:14px;padding:12px;background:var(--bg-elev);border-radius:8px;">'+
      '<div style="font-size:11px;color:var(--text2);margin-bottom:2px;">Capacidad total</div>'+
      '<div style="font-size:18px;font-weight:700;">'+fmtInt(tot)+' m²</div>'+
      '<div style="font-size:11px;color:var(--text2);margin:10px 0 2px;">Ocupación real (activos o sin estado)</div>'+
      '<div style="font-size:18px;font-weight:700;color:'+(totalOcup>tot?'var(--red)':'var(--green)')+';">'+fmtInt(totalOcup)+' m²</div>'+
      (totalOcup>tot?'<div style="color:var(--red);font-size:11px;margin-top:6px;">⚠ SOBREPASADO por '+fmtInt(totalOcup-tot)+' m²</div>':'')+
      '</div>'+
      '<h4 style="margin-bottom:10px;font-size:12px;">Contratos asignados ('+cbs.length+')</h4>'+
      '<div class="table-wrap"><table><thead><tr><th>Contrato</th><th>Cliente</th><th>Estado</th><th>Vigencia</th><th>M²</th><th>$/m²</th><th>Total</th></tr></thead><tbody>'+
      (cbs.length===0?'<tr><td colspan="7" class="empty">Sin registros</td></tr>':
      cbs.map(function(r){
        var c=contMap[r.contrato_id]||{};
        var cli=cliMap[c.cliente_id]||{};
        var estCls=c.activo===true?'badge-green':c.activo===false?'badge-red':'badge-yellow';
        var estTxt=c.activo===true?'Activo':c.activo===false?'Inactivo':'Sin estado';
        var ini=c.fecha_inicio?new Date(c.fecha_inicio).toLocaleDateString('en-US'):'—';
        var fin=c.fecha_fin?new Date(c.fecha_fin).toLocaleDateString('en-US'):'—';
        var subT=parseFloat(r.mts2||0)*parseFloat(r.valor_m2||0);
        return '<tr><td><strong>'+esc(c.codigo||'ID '+r.contrato_id)+'</strong></td>'+
          '<td>'+esc(cli.razon_social||'—')+'</td>'+
          '<td><span class="badge '+estCls+'">'+estTxt+'</span></td>'+
          '<td style="font-size:11px;">'+ini+' → '+fin+'</td>'+
          '<td>'+fmt(r.mts2||0)+' m²</td>'+
          '<td>$'+fmt(r.valor_m2||0)+'</td>'+
          '<td>$'+fmt(subT)+'</td></tr>';
      }).join(''))+
      '</tbody></table></div>';
    openModal(bod.nombre+' — Detalle de ocupación',body,'<button class="btn-ghost" onclick="closeModal()">Cerrar</button>');
  }catch(e){toast('Error: '+e.message,'error');}
}

async function modalBodega(id){
  var b={nombre:'',tipo:'almacen',ubicacion:'',mts2_totales:0,pct_pasillos:15,mts2_disponibles:0,valor_m2_alquiler:0};
  if(id){var res=await sbFetch('/rest/v1/bodegas?id=eq.'+id);var d=await res.json();if(d&&d[0])b=d[0];}
  openModal(id?'Editar Bodega':'Nueva Bodega',
    '<div class="form-row"><div><label>Nombre *</label><input id="bNombre" value="'+esc(b.nombre)+'"/></div><div><label>Tipo *</label><select id="bTipo"><option value="almacen"'+((b.tipo||'almacen')==='almacen'?' selected':'')+'>Almacén</option><option value="predio"'+(b.tipo==='predio'?' selected':'')+'>Predio</option></select></div></div>'+
    '<div class="form-field"><label>Ubicación</label><input id="bUbic" value="'+esc(b.ubicacion)+'"/></div>'+
    '<div class="form-row"><div><label>Total M² *</label><input id="bTotal" type="number" step="0.01" value="'+(b.mts2_totales||0)+'" oninput="_calcDisp()"/></div><div><label>% Pasillos</label><input id="bPct" type="number" step="0.01" value="'+(b.pct_pasillos||0)+'" oninput="_calcDisp()"/></div></div>'+
    '<div class="form-row"><div><label>M² Disponibles (auto)</label><input id="bDisp" type="number" step="0.01" value="'+(b.mts2_disponibles||0)+'" readonly style="background:var(--bg-body);cursor:not-allowed;opacity:.7;" title="Se calcula automáticamente: Total × (1 - %Pasillos/100)"/></div><div><label>Valor $ / m²</label><input id="bVal" type="number" step="0.01" value="'+(b.valor_m2_alquiler||0)+'"/></div></div>',
    '<button class="btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn-primary" onclick="guardarBodega('+(id||0)+')">Guardar</button>');
}
function _calcDisp(){
  var t = parseFloat(document.getElementById('bTotal').value)||0;
  var p = parseFloat(document.getElementById('bPct').value)||0;
  var d = t * (1 - p/100);
  document.getElementById('bDisp').value = d.toFixed(2);
}
async function guardarBodega(id){
  var t = parseFloat(document.getElementById('bTotal').value)||0;
  var p = parseFloat(document.getElementById('bPct').value)||0;
  var rec={nombre:document.getElementById('bNombre').value.trim(),tipo:document.getElementById('bTipo').value,ubicacion:document.getElementById('bUbic').value.trim()||null,mts2_totales:t,pct_pasillos:p,mts2_disponibles:t*(1-p/100),valor_m2_alquiler:parseFloat(document.getElementById('bVal').value)||0};
  if(!rec.nombre){toast('Nombre requerido','error');return;}
  var res=await sbFetch('/rest/v1/bodegas'+(id?'?id=eq.'+id:''),{method:id?'PATCH':'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(rec)});
  if(!res.ok){var e=await res.json();toast('Error: '+(e.message||res.status),'error');return;}
  toast(id?'Bodega actualizada':'Bodega creada');closeModal();renderBodegas();
}
async function eliminarBodega(id){
  if(!(await confirmar('¿Eliminar esta bodega?')))return;
  var res=await sbFetch('/rest/v1/bodegas?id=eq.'+id,{method:'DELETE'});
  if(!res.ok){toast('Error al eliminar','error');return;}
  toast('Bodega eliminada');renderBodegas();
}

async function renderContratos(){
  document.getElementById('mainArea').innerHTML='<div class="loading">Cargando...</div>';
  try{
    var [rC,rCB]=await Promise.all([
      sbFetch('/rest/v1/contratos?select=*,clientes_almacen(razon_social,codigo)&order=codigo.desc'),
      sbFetch('/rest/v1/contrato_bodegas?select=*,bodegas(nombre)&order=id.asc')
    ]);
    var contratos=await rC.json();if(!Array.isArray(contratos))contratos=[];
    var contBod=await rCB.json();if(!Array.isArray(contBod))contBod=[];
    var bodPor={};contBod.forEach(function(cb){(bodPor[cb.contrato_id]=bodPor[cb.contrato_id]||[]).push(cb);});
    var hoy=new Date();hoy.setHours(0,0,0,0);
    var en90=new Date();en90.setHours(0,0,0,0);en90.setDate(en90.getDate()+90);
    document.getElementById('mainArea').innerHTML=
      '<div class="page-header">'+
        '<div><div class="page-title">'+ico('contract','ico-lg')+' Contratos</div>'+
        '<div class="page-sub">Contratos de arrendamiento con bodegas asignadas</div></div>'+
        '<button class="btn-primary" onclick="modalContrato()">'+ico('plus','ico-sm')+' Nuevo contrato</button>'+
      '</div>'+
      '<div class="card">'+
        '<div class="card-header"><h3>'+ico('contract')+' Listado de Contratos</h3><span class="count">'+contratos.length+' registros</span></div>'+
        '<div class="table-wrap"><table><thead><tr><th>Código</th><th>Cliente</th><th>Bodegas</th><th>Total M²</th><th>Renta/mes</th><th>Inicio</th><th>Fin</th><th>Estado</th><th>Renov.</th><th style="text-align:right;">Acciones</th></tr></thead><tbody>'+
        (contratos.length===0?'<tr><td colspan="10" class="empty">Sin contratos</td></tr>':
        contratos.map(function(c){
          var lin=bodPor[c.id]||[];
          var totM=lin.reduce(function(a,l){return a+parseFloat(l.mts2||0);},0);
          var renta=lin.reduce(function(a,l){return a+(parseFloat(l.mts2||0)*parseFloat(l.valor_m2||0));},0);
          var nombres=lin.map(function(l){return l.bodegas&&l.bodegas.nombre;}).filter(Boolean).join(', ');
          var fin=c.fecha_fin?new Date(c.fecha_fin):null;
          if(fin)fin.setHours(0,0,0,0);
          var estado;
          if(c.activo===false){estado='<span class="badge badge-red">Inactivo</span>';}
          else if(fin && fin < hoy){estado='<span class="badge badge-red">Vencido</span>';}
          else if(fin && fin <= en90){estado='<span class="badge badge-yellow">Por vencer</span>';}
          else{estado='<span class="badge badge-green">Activo</span>';}
          var ini=c.fecha_inicio?new Date(c.fecha_inicio).toLocaleDateString('en-US'):'—';
          var finT=c.fecha_fin?new Date(c.fecha_fin).toLocaleDateString('en-US'):'—';
          var cli=c.clientes_almacen?c.clientes_almacen.razon_social:'—';
          return '<tr><td><strong>'+esc(c.codigo||'—')+'</strong></td>'+
            '<td>'+esc(cli)+'</td>'+
            '<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+esc(nombres)+'">'+esc(nombres||'—')+'</td>'+
            '<td>'+fmtInt(totM)+' m²</td>'+
            '<td>$'+fmt(renta)+'</td>'+
            '<td>'+ini+'</td>'+
            '<td>'+finT+'</td>'+
            '<td>'+estado+'</td>'+
            '<td>'+(c.renovado_de?'<span class="badge badge-steel" title="Renovación">↻ '+c.renovado_de+'</span>':'—')+'</td>'+
            '<td><div class="actions">'+
              '<button class="btn-ghost btn-icon" onclick="modalContrato('+c.id+')" title="Editar">'+ico('edit','ico-sm')+'</button>'+
              '<button class="btn-steel btn-icon" onclick="modalContrato(0,'+c.id+')" title="Renovar" style="padding:5px 8px;">↻</button>'+
              '<button class="btn-danger btn-icon" onclick="eliminarContrato('+c.id+')" title="Eliminar">'+ico('trash','ico-sm')+'</button>'+
            '</div></td></tr>';
        }).join(''))+
        '</tbody></table></div></div>';
  }catch(e){toast('Error: '+e.message,'error');document.getElementById('mainArea').innerHTML='<div class="empty">Error</div>';}
}
async function modalContrato(id, renovarDeId){
  var c={codigo:'',cliente_id:null,fecha_inicio:'',fecha_fin:'',activo:true,observaciones:'',renovado_de:null};
  var lineas=[];
  var [rCli,rBod,rAllCont]=await Promise.all([
    sbFetch('/rest/v1/clientes_almacen?select=id,codigo,razon_social&order=razon_social.asc'),
    sbFetch('/rest/v1/bodegas?select=id,nombre&order=nombre.asc'),
    sbFetch('/rest/v1/contratos?select=id,codigo,cliente_id,fecha_fin&order=codigo.desc&limit=10000')
  ]);
  var clientes=await rCli.json();if(!Array.isArray(clientes))clientes=[];
  var bodegas=await rBod.json();if(!Array.isArray(bodegas))bodegas=[];
  var allContratos=await rAllCont.json();if(!Array.isArray(allContratos))allContratos=[];
  if(id){var [r1,r2]=await Promise.all([sbFetch('/rest/v1/contratos?id=eq.'+id),sbFetch('/rest/v1/contrato_bodegas?contrato_id=eq.'+id)]);var d1=await r1.json();if(d1&&d1[0])c=d1[0];var d2=await r2.json();if(Array.isArray(d2))lineas=d2.map(function(l){return{id:l.id,bodega_id:l.bodega_id,mts2:l.mts2,valor_m2:l.valor_m2};});}
  else if(renovarDeId){
    // Precargar datos del contrato a renovar
    var [rOld,rOldB]=await Promise.all([sbFetch('/rest/v1/contratos?id=eq.'+renovarDeId),sbFetch('/rest/v1/contrato_bodegas?contrato_id=eq.'+renovarDeId)]);
    var dOld=await rOld.json();
    if(dOld&&dOld[0]){
      var orig=dOld[0];
      c.cliente_id=orig.cliente_id;
      c.observaciones='Renovación del contrato '+orig.codigo;
      c.renovado_de=renovarDeId;
      // Sugerir fechas: inicio = día siguiente al fin del original, fin = +1 año
      if(orig.fecha_fin){
        var nextIni=new Date(orig.fecha_fin);nextIni.setDate(nextIni.getDate()+1);
        c.fecha_inicio=nextIni.toISOString().split('T')[0];
        var nextFin=new Date(nextIni);nextFin.setFullYear(nextFin.getFullYear()+1);
        c.fecha_fin=nextFin.toISOString().split('T')[0];
      }
    }
    var dOldB=await rOldB.json();
    if(Array.isArray(dOldB))lineas=dOldB.map(function(l){return{id:null,bodega_id:l.bodega_id,mts2:l.mts2,valor_m2:l.valor_m2};});
    var rAllCode=await sbFetch('/rest/v1/contratos?select=codigo&order=codigo.desc&limit=1');
    var daCode=await rAllCode.json();
    var nextN=1;if(daCode&&daCode[0]&&daCode[0].codigo){var mM=daCode[0].codigo.match(/(\d+)/);if(mM)nextN=parseInt(mM[1])+1;}
    c.codigo='CONT-'+String(nextN).padStart(5,'0');
  }
  else{var rAll=await sbFetch('/rest/v1/contratos?select=codigo&order=codigo.desc&limit=1');var da=await rAll.json();var next=1;if(da&&da[0]&&da[0].codigo){var m=da[0].codigo.match(/(\d+)/);if(m)next=parseInt(m[1])+1;}c.codigo='CONT-'+String(next).padStart(5,'0');}
  window._modLin=lineas;window._modBod=bodegas;window._modAllCont=allContratos;
  var optsC=clientes.map(function(x){return '<option value="'+x.id+'"'+(c.cliente_id===x.id?' selected':'')+'>'+esc(x.codigo+' — '+x.razon_social)+'</option>';}).join('');
  var renovacionBanner = c.renovado_de ? '<div style="background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);color:var(--steel);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:12px;">'+ico('contract','ico-sm')+' Este contrato es una renovación del contrato original (ID '+c.renovado_de+')</div>' : '';
  openModal(id?'Editar Contrato':(renovarDeId?'Renovar Contrato':'Nuevo Contrato'),
    renovacionBanner+
    '<div class="form-row"><div><label>Código *</label><input id="ctCod" value="'+esc(c.codigo)+'"/></div><div><label>Estado</label><select id="ctAct"><option value="true"'+(c.activo?' selected':'')+'>Activo</option><option value="false"'+(!c.activo?' selected':'')+'>Inactivo</option></select></div></div>'+
    '<div class="form-field"><label>Cliente *</label><select id="ctCli"><option value="">— Seleccionar —</option>'+optsC+'</select></div>'+
    '<div class="form-row"><div><label>Fecha Inicio</label><input id="ctIni" type="date" value="'+(c.fecha_inicio||'')+'"/></div><div><label>Fecha Fin</label><input id="ctFin" type="date" value="'+(c.fecha_fin||'')+'"/></div></div>'+
    '<input type="hidden" id="ctRenovadoDe" value="'+(c.renovado_de||'')+'"/>'+
    '<div class="form-field"><label>Observaciones</label><textarea id="ctObs" rows="2">'+esc(c.observaciones||'')+'</textarea></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;"><label style="margin:0;">Bodegas asignadas</label><button class="btn-steel btn-icon" onclick="_agregarLin()">+ Agregar bodega</button></div>'+
    '<div id="lineasBod"></div>',
    '<button class="btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn-primary" onclick="guardarContrato('+(id||0)+')">Guardar</button>');
  _renderLin();
}
function _renderLin(){var el=document.getElementById('lineasBod');if(!el)return;var lin=window._modLin||[];var bod=window._modBod||[];if(lin.length===0){el.innerHTML='<div style="padding:14px;color:var(--text3);font-size:11px;text-align:center;background:var(--bg-elev);border-radius:8px;">Sin bodegas. Clic en "Agregar bodega".</div>';return;}el.innerHTML=lin.map(function(l,i){var opts=bod.map(function(b){return '<option value="'+b.id+'"'+(l.bodega_id===b.id?' selected':'')+'>'+esc(b.nombre)+'</option>';}).join('');return '<div class="linea-bod"><div><label>Bodega</label><select data-i="'+i+'" data-f="bodega_id" onchange="_updLin(this)"><option value="">—</option>'+opts+'</select></div><div><label>M²</label><input type="number" step="0.01" value="'+(l.mts2||0)+'" data-i="'+i+'" data-f="mts2" onchange="_updLin(this)"/></div><div><label>$/m²</label><input type="number" step="0.01" value="'+(l.valor_m2||0)+'" data-i="'+i+'" data-f="valor_m2" onchange="_updLin(this)"/></div><div><button class="btn-danger btn-icon" onclick="_delLin('+i+')">✕</button></div></div>';}).join('');}
function _updLin(el){var i=parseInt(el.getAttribute('data-i'));var f=el.getAttribute('data-f');var v=f==='bodega_id'?(parseInt(el.value)||null):(parseFloat(el.value)||0);if(window._modLin&&window._modLin[i])window._modLin[i][f]=v;}
function _agregarLin(){if(!window._modLin)window._modLin=[];window._modLin.push({id:null,bodega_id:null,mts2:0,valor_m2:0});_renderLin();}
function _delLin(i){if(window._modLin)window._modLin.splice(i,1);_renderLin();}
async function guardarContrato(id){
  var renovadoDeVal=document.getElementById('ctRenovadoDe').value;
  var rec={codigo:document.getElementById('ctCod').value.trim(),cliente_id:parseInt(document.getElementById('ctCli').value)||null,fecha_inicio:document.getElementById('ctIni').value||null,fecha_fin:document.getElementById('ctFin').value||null,observaciones:document.getElementById('ctObs').value.trim()||null,activo:document.getElementById('ctAct').value==='true',renovado_de:renovadoDeVal?parseInt(renovadoDeVal):null};
  var lineas=(window._modLin||[]).filter(function(l){return l.bodega_id&&l.mts2>0;});
  if(!rec.codigo||!rec.cliente_id){toast('Código y Cliente requeridos','error');return;}
  if(lineas.length===0){toast('Agregá al menos una bodega','error');return;}
  var res=await sbFetch('/rest/v1/contratos'+(id?'?id=eq.'+id:''),{method:id?'PATCH':'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(rec)});
  if(!res.ok){var e=await res.json();toast('Error: '+(e.message||res.status),'error');return;}
  var saved=await res.json();
  var contId=id||(Array.isArray(saved)?saved[0].id:saved.id);
  if(id)await sbFetch('/rest/v1/contrato_bodegas?contrato_id=eq.'+contId,{method:'DELETE'});
  var inserts=lineas.map(function(l){return{contrato_id:contId,bodega_id:l.bodega_id,mts2:l.mts2,valor_m2:l.valor_m2};});
  var rIns=await sbFetch('/rest/v1/contrato_bodegas',{method:'POST',body:JSON.stringify(inserts)});
  if(!rIns.ok){var e2=await rIns.json();toast('Error bodegas: '+(e2.message||rIns.status),'error');return;}
  // Si es renovación, marcar el original como inactivo
  if(!id && rec.renovado_de){
    await sbFetch('/rest/v1/contratos?id=eq.'+rec.renovado_de,{method:'PATCH',body:JSON.stringify({activo:false})});
  }
  toast(id?'Contrato actualizado':(rec.renovado_de?'Contrato renovado':'Contrato creado'));closeModal();renderContratos();cargarAlertas();
}
async function eliminarContrato(id){
  if(!(await confirmar('¿Eliminar este contrato?')))return;
  await sbFetch('/rest/v1/contrato_bodegas?contrato_id=eq.'+id,{method:'DELETE'});
  var res=await sbFetch('/rest/v1/contratos?id=eq.'+id,{method:'DELETE'});
  if(!res.ok){toast('Error al eliminar','error');return;}
  toast('Contrato eliminado');renderContratos();cargarAlertas();
}

async function modalOcupacion(id){
  var o={contrato_id:null,semana:new Date().toISOString().split('T')[0],mts2_ocupados:0};
  if(id){var res=await sbFetch('/rest/v1/ocupaciones?id=eq.'+id);var d=await res.json();if(d&&d[0])o=d[0];}
  var rC=await sbFetch('/rest/v1/contratos?select=id,codigo,clientes_almacen(razon_social)&activo=eq.true&order=codigo.asc');
  var conts=await rC.json();if(!Array.isArray(conts))conts=[];
  var opts=conts.map(function(c){var cli=c.clientes_almacen?' — '+c.clientes_almacen.razon_social:'';return '<option value="'+c.id+'"'+(o.contrato_id===c.id?' selected':'')+'>'+esc(c.codigo+cli)+'</option>';}).join('');
  openModal(id?'Editar Ocupación':'Registrar Ocupación',
    '<div class="form-field"><label>Contrato *</label><select id="oCont"><option value="">— Seleccionar —</option>'+opts+'</select></div>'+
    '<div class="form-row"><div><label>Semana (fecha lunes) *</label><input id="oSem" type="date" value="'+(o.semana||'')+'"/></div><div><label>M² Ocupados *</label><input id="oMts" type="number" step="0.01" value="'+(o.mts2_ocupados||0)+'"/></div></div>',
    '<button class="btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn-primary" onclick="guardarOcupacion('+(id||0)+')">Guardar</button>');
}
async function guardarOcupacion(id){
  var rec={contrato_id:parseInt(document.getElementById('oCont').value)||null,semana:document.getElementById('oSem').value||null,mts2_ocupados:parseFloat(document.getElementById('oMts').value)||0};
  if(!rec.contrato_id||!rec.semana||!rec.mts2_ocupados){toast('Todos los campos requeridos','error');return;}
  var res=await sbFetch('/rest/v1/ocupaciones'+(id?'?id=eq.'+id:''),{method:id?'PATCH':'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(rec)});
  if(!res.ok){var e=await res.json();toast('Error: '+(e.message||res.status),'error');return;}
  toast(id?'Ocupación actualizada':'Ocupación registrada');closeModal();renderOcupaciones();
}
async function eliminarOcupacion(id){
  if(!(await confirmar('¿Eliminar este registro?')))return;
  var res=await sbFetch('/rest/v1/ocupaciones?id=eq.'+id,{method:'DELETE'});
  if(!res.ok){toast('Error al eliminar','error');return;}
  toast('Ocupación eliminada');renderOcupaciones();
}

// ═══ PROYECCIÓN ═══
async function renderProyeccion(){
  if(!window._proy){window._proy={anio:new Date().getFullYear(),vista:'consolidado',escenario:'realista'};}
  document.getElementById('mainArea').innerHTML='<div class="loading">Cargando proyección...</div>';
  try{
    var [rB,rCB,rC,rCli]=await Promise.all([
      sbFetch('/rest/v1/bodegas?select=*&limit=10000'),
      sbFetch('/rest/v1/contrato_bodegas?select=*&limit=10000'),
      sbFetch('/rest/v1/contratos?select=*&limit=10000'),
      sbFetch('/rest/v1/clientes_almacen?select=*&limit=10000')
    ]);
    var bodegas=await rB.json();if(!Array.isArray(bodegas))bodegas=[];
    var cb=await rCB.json();if(!Array.isArray(cb))cb=[];
    var contratos=await rC.json();if(!Array.isArray(contratos))contratos=[];
    var clientes=await rCli.json();if(!Array.isArray(clientes))clientes=[];
    var bodMap={};bodegas.forEach(function(b){bodMap[b.id]=b;});
    var contMap={};contratos.forEach(function(c){contMap[c.id]=c;});
    var anio=window._proy.anio;var vista=window._proy.vista;var escn=window._proy.escenario;
    var meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    var anioActual=new Date().getFullYear();

    function vigenteEnMes(r,m){var c=contMap[r.contrato_id];if(!c)return false;if(c.activo===false)return false;var primerDia=new Date(anio,m,1);var ultimoDia=new Date(anio,m+1,0);var ini=c.fecha_inicio?new Date(c.fecha_inicio):null;var fin=c.fecha_fin?new Date(c.fecha_fin):null;if(escn==='realista'){if(ini&&ini>ultimoDia)return false;if(fin&&fin<primerDia)return false;return true;}else{if(ini&&ini>ultimoDia)return false;return true;}}

    var proy=[];
    for(var m=0;m<12;m++){
      var vigentes=cb.filter(function(r){return vigenteEnMes(r,m);});
      var mts2=vigentes.reduce(function(a,r){return a+parseFloat(r.mts2||0);},0);
      var ing=vigentes.reduce(function(a,r){return a+(parseFloat(r.mts2||0)*parseFloat(r.valor_m2||0));},0);
      var cos=vigentes.reduce(function(a,r){var b=bodMap[r.bodega_id];return a+(parseFloat(r.mts2||0)*(b?parseFloat(b.valor_m2_alquiler||0):0));},0);
      var setC={};vigentes.forEach(function(r){setC[r.contrato_id]=true;});
      proy.push({mes:m,mts2:mts2,contratos:Object.keys(setC).length,ingresos:ing,costos:cos,utilidad:ing-cos});
    }
    var totalMts2=bodegas.reduce(function(a,b){return a+parseFloat(b.mts2_totales||0);},0);
    var totIng=proy.reduce(function(a,p){return a+p.ingresos;},0);
    var totCos=proy.reduce(function(a,p){return a+p.costos;},0);
    var totUti=totIng-totCos;
    var promOcup=totalMts2>0?Math.round((proy.reduce(function(a,p){return a+p.mts2;},0)/12/totalMts2)*100):0;

    var html='<div class="page-header">'+
      '<div><div class="page-title">'+ico('trend','ico-lg')+' Proyección</div>'+
      '<div class="page-sub">Ocupación e ingresos proyectados por mes</div></div>'+
      '</div>'+
      '<div class="card"><div class="card-header" style="padding:16px;"><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:end;width:100%;">'+
        '<div style="min-width:150px;"><label>Año</label><select id="pAnio" onchange="_proyChg()"><option value="'+anioActual+'"'+(anio===anioActual?' selected':'')+'>'+anioActual+' (actual)</option><option value="'+(anioActual+1)+'"'+(anio===anioActual+1?' selected':'')+'>'+(anioActual+1)+' (próximo)</option><option value="'+(anioActual+2)+'"'+(anio===anioActual+2?' selected':'')+'>'+(anioActual+2)+'</option></select></div>'+
        '<div style="min-width:170px;"><label>Vista</label><select id="pVista" onchange="_proyChg()"><option value="consolidado"'+(vista==='consolidado'?' selected':'')+'>Consolidado</option><option value="bodega"'+(vista==='bodega'?' selected':'')+'>Por Bodega</option><option value="cliente"'+(vista==='cliente'?' selected':'')+'>Por Cliente</option></select></div>'+
        '<div style="min-width:220px;"><label>Escenario</label><select id="pEsc" onchange="_proyChg()"><option value="realista"'+(escn==='realista'?' selected':'')+'>Realista (respeta vencimientos)</option><option value="optimista"'+(escn==='optimista'?' selected':'')+'>Optimista (renovación asumida)</option></select></div>'+
      '</div></div></div>'+
      '<div class="kpi-grid">'+
        '<div class="kpi green"><div class="kpi-head"><div class="kpi-icon">'+ico('cash')+'</div></div><div class="kpi-val">$'+fmt(totIng)+'</div><div class="kpi-lbl">Ingresos '+anio+'</div></div>'+
        '<div class="kpi red"><div class="kpi-head"><div class="kpi-icon">'+ico('cash')+'</div></div><div class="kpi-val">$'+fmt(totCos)+'</div><div class="kpi-lbl">Costo '+anio+'</div></div>'+
        '<div class="kpi yellow"><div class="kpi-head"><div class="kpi-icon">'+ico('trend')+'</div></div><div class="kpi-val">$'+fmt(totUti)+'</div><div class="kpi-lbl">Utilidad '+anio+'</div></div>'+
        '<div class="kpi steel"><div class="kpi-head"><div class="kpi-icon">'+ico('ruler')+'</div></div><div class="kpi-val">'+promOcup+'%</div><div class="kpi-lbl">Ocupación promedio</div></div>'+
      '</div>';
    html+=_proyGrafico(proy,meses);

    if(vista==='consolidado'){
      html+='<div class="card">'+
        '<div class="card-header"><h3>'+ico('chart')+' Proyección Mensual '+anio+'</h3><span class="count">Escenario: '+(escn==='realista'?'Realista':'Optimista')+'</span></div>'+
        '<div class="table-wrap"><table><thead><tr><th>Mes</th><th>M² Ocupados</th><th>Contratos</th><th>Ingresos</th><th>Costo</th><th>Utilidad</th><th>Ocupación</th></tr></thead><tbody>'+
        proy.map(function(p){
          var pct=totalMts2>0?Math.round((p.mts2/totalMts2)*100):0;
          var badge=pct>=90?'red':pct>=60?'yellow':'green';
          return '<tr><td><strong>'+meses[p.mes]+' '+anio+'</strong></td><td>'+fmtInt(p.mts2)+' m²</td><td>'+p.contratos+'</td><td style="color:var(--green);">$'+fmt(p.ingresos)+'</td><td style="color:var(--red);">$'+fmt(p.costos)+'</td><td style="font-weight:700;">$'+fmt(p.utilidad)+'</td><td><span class="badge badge-'+badge+'">'+pct+'%</span></td></tr>';
        }).join('')+
        '<tr style="background:var(--bg-elev);font-weight:700;"><td>TOTAL '+anio+'</td><td>—</td><td>—</td><td style="color:var(--green);">$'+fmt(totIng)+'</td><td style="color:var(--red);">$'+fmt(totCos)+'</td><td>$'+fmt(totUti)+'</td><td>'+promOcup+'%</td></tr>'+
        '</tbody></table></div></div>';
    }else if(vista==='bodega'){
      html+='<div class="card"><div class="card-header"><h3>'+ico('warehouse')+' Ingresos por Bodega — '+anio+'</h3></div><div class="table-wrap"><table><thead><tr><th style="position:sticky;left:0;background:var(--bg-panel);z-index:2;">Bodega</th>';
      for(var i=0;i<12;i++)html+='<th>'+meses[i]+'</th>';
      html+='<th>Total</th></tr></thead><tbody>';
      bodegas.forEach(function(b){
        html+='<tr><td style="position:sticky;left:0;background:var(--bg-panel);z-index:1;"><strong>'+esc(b.nombre)+'</strong></td>';
        var totB=0;
        for(var mm=0;mm<12;mm++){var v=cb.filter(function(r){return r.bodega_id===b.id&&vigenteEnMes(r,mm);}).reduce(function(a,r){return a+(parseFloat(r.mts2||0)*parseFloat(r.valor_m2||0));},0);totB+=v;html+='<td>'+(v>0?'$'+fmt(v):'—')+'</td>';}
        html+='<td style="font-weight:700;">$'+fmt(totB)+'</td></tr>';
      });
      html+='<tr style="background:var(--bg-elev);font-weight:700;"><td style="position:sticky;left:0;background:var(--bg-elev);z-index:1;">TOTAL</td>';
      for(var mm=0;mm<12;mm++)html+='<td>$'+fmt(proy[mm].ingresos)+'</td>';
      html+='<td>$'+fmt(totIng)+'</td></tr></tbody></table></div></div>';
    }else if(vista==='cliente'){
      var cliUsados={};contratos.forEach(function(c){if(c.cliente_id)cliUsados[c.cliente_id]=true;});
      var clis=clientes.filter(function(c){return cliUsados[c.id];}).sort(function(a,b){return(a.razon_social||'').localeCompare(b.razon_social||'');});
      html+='<div class="card"><div class="card-header"><h3>'+ico('users')+' Ingresos por Cliente — '+anio+'</h3><span class="count">'+clis.length+' clientes</span></div><div class="table-wrap"><table><thead><tr><th style="position:sticky;left:0;background:var(--bg-panel);z-index:2;">Cliente</th>';
      for(var i=0;i<12;i++)html+='<th>'+meses[i]+'</th>';
      html+='<th>Total</th></tr></thead><tbody>';
      clis.forEach(function(cli){
        html+='<tr><td style="position:sticky;left:0;background:var(--bg-panel);z-index:1;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+esc(cli.razon_social)+'"><strong>'+esc(cli.razon_social)+'</strong></td>';
        var totC=0;
        for(var mm=0;mm<12;mm++){var v=cb.filter(function(r){var c=contMap[r.contrato_id];return c&&c.cliente_id===cli.id&&vigenteEnMes(r,mm);}).reduce(function(a,r){return a+(parseFloat(r.mts2||0)*parseFloat(r.valor_m2||0));},0);totC+=v;html+='<td>'+(v>0?'$'+fmt(v):'—')+'</td>';}
        html+='<td style="font-weight:700;">$'+fmt(totC)+'</td></tr>';
      });
      html+='<tr style="background:var(--bg-elev);font-weight:700;"><td style="position:sticky;left:0;background:var(--bg-elev);z-index:1;">TOTAL</td>';
      for(var mm=0;mm<12;mm++)html+='<td>$'+fmt(proy[mm].ingresos)+'</td>';
      html+='<td>$'+fmt(totIng)+'</td></tr></tbody></table></div></div>';
    }
    document.getElementById('mainArea').innerHTML=html;
  }catch(e){toast('Error: '+e.message,'error');document.getElementById('mainArea').innerHTML='<div class="empty">Error</div>';}
}
function _proyChg(){window._proy.anio=parseInt(document.getElementById('pAnio').value);window._proy.vista=document.getElementById('pVista').value;window._proy.escenario=document.getElementById('pEsc').value;renderProyeccion();}
function _proyGrafico(proy,meses){
  var maxV=Math.max.apply(null,proy.map(function(p){return Math.max(p.ingresos,p.costos);}));
  if(maxV===0)maxV=1;
  var w=900,h=280,pad=50;
  var slot=(w-pad*2)/12;var bw=slot/2-4;
  var svg='<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:280px;">';
  for(var g=0;g<=4;g++){var y=pad+((h-pad*2)*g/4);var val=maxV*(1-g/4);svg+='<line x1="'+pad+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="rgba(148,163,184,.08)"/>';svg+='<text x="'+(pad-6)+'" y="'+(y+3)+'" text-anchor="end" fill="#94a3b8" font-size="9">$'+fmtInt(val)+'</text>';}
  for(var i=0;i<12;i++){var xBase=pad+i*slot+4;var hIng=maxV>0?((h-pad*2)*proy[i].ingresos)/maxV:0;var hCos=maxV>0?((h-pad*2)*proy[i].costos)/maxV:0;svg+='<rect x="'+xBase+'" y="'+(h-pad-hIng)+'" width="'+bw+'" height="'+hIng+'" fill="#10b981" rx="2"><title>Ing '+meses[i]+': $'+fmt(proy[i].ingresos)+'</title></rect>';svg+='<rect x="'+(xBase+bw+2)+'" y="'+(h-pad-hCos)+'" width="'+bw+'" height="'+hCos+'" fill="#ef4444" rx="2"><title>Cos '+meses[i]+': $'+fmt(proy[i].costos)+'</title></rect>';svg+='<text x="'+(xBase+bw)+'" y="'+(h-pad+16)+'" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">'+meses[i]+'</text>';}
  svg+='</svg>';
  return '<div class="card"><div class="card-header"><h3>'+ico('chart')+' Ingresos vs Costos por Mes</h3><span class="count"><span style="color:#10b981;font-weight:700;">■</span> Ingresos &nbsp; <span style="color:#ef4444;font-weight:700;">■</span> Costo</span></div><div style="padding:16px;overflow-x:auto;">'+svg+'</div></div>';
}


// ═══════════════════════════════════════════════════════════════
// ALERTAS (bell)
// ═══════════════════════════════════════════════════════════════
var _alertas = { porVencer:[], vencidos:[] };
async function cargarAlertas(){
  try{
    var [rC, rCli] = await Promise.all([
      sbFetch('/rest/v1/contratos?select=*&limit=10000'),
      sbFetch('/rest/v1/clientes_almacen?select=id,razon_social&limit=10000')
    ]);
    var contratos = await rC.json(); if(!Array.isArray(contratos)) contratos=[];
    var clientes = await rCli.json(); if(!Array.isArray(clientes)) clientes=[];
    var cliMap={}; clientes.forEach(function(c){ cliMap[c.id]=c; });
    var hoy=new Date(); hoy.setHours(0,0,0,0);
    var en90=new Date(); en90.setHours(0,0,0,0); en90.setDate(en90.getDate()+90);
    _alertas.porVencer = [];
    _alertas.vencidos = [];
    contratos.forEach(function(c){
      if(c.activo===false) return;
      var fin=c.fecha_fin?new Date(c.fecha_fin):null;
      if(!fin) return;
      fin.setHours(0,0,0,0);
      var cli = cliMap[c.cliente_id] || {};
      var item = { id:c.id, codigo:c.codigo, cliente:cli.razon_social||'—', fecha_fin:c.fecha_fin };
      if(fin < hoy) _alertas.vencidos.push(item);
      else if(fin <= en90) _alertas.porVencer.push(item);
    });
    var total = _alertas.porVencer.length + _alertas.vencidos.length;
    var badge = document.getElementById('bellBadge');
    if(badge){
      if(total > 0){
        badge.textContent = total > 99 ? '99+' : total;
        badge.style.display = 'flex';
      } else {
        badge.style.display = 'none';
      }
    }
  }catch(e){ console.error('Error cargando alertas:',e); }
}

function verAlertas(){
  var body = '';
  if(_alertas.vencidos.length === 0 && _alertas.porVencer.length === 0){
    body = '<div style="padding:40px;text-align:center;color:var(--text3);">'+ico('check','ico-lg')+'<div style="margin-top:10px;">No hay alertas pendientes</div></div>';
  } else {
    if(_alertas.vencidos.length > 0){
      body += '<div style="padding:10px 14px;background:var(--bg-elev);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--red);">'+ico('contract','ico-sm')+' Contratos vencidos ('+_alertas.vencidos.length+')</div>';
      body += _alertas.vencidos.map(function(a){
        var fin = a.fecha_fin ? new Date(a.fecha_fin).toLocaleDateString('en-US') : '—';
        var dias = Math.floor((new Date() - new Date(a.fecha_fin))/(1000*60*60*24));
        return '<div class="alert-item">'+
          '<div class="alert-icon red">'+ico('contract','ico-sm')+'</div>'+
          '<div class="alert-body"><div class="alert-title">'+esc(a.codigo)+' — '+esc(a.cliente)+'</div>'+
          '<div class="alert-sub">Venció el '+fin+' · hace '+dias+' días</div></div>'+
          '<button class="btn-steel btn-icon" onclick="closeModal();navTo(\'contratos\');" style="padding:5px 10px;">Ver</button>'+
        '</div>';
      }).join('');
    }
    if(_alertas.porVencer.length > 0){
      body += '<div style="padding:10px 14px;background:var(--bg-elev);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--yellow);">'+ico('contract','ico-sm')+' Por vencer próximos 90 días ('+_alertas.porVencer.length+')</div>';
      body += _alertas.porVencer.map(function(a){
        var fin = a.fecha_fin ? new Date(a.fecha_fin).toLocaleDateString('en-US') : '—';
        var dias = Math.floor((new Date(a.fecha_fin) - new Date())/(1000*60*60*24));
        return '<div class="alert-item">'+
          '<div class="alert-icon yellow">'+ico('contract','ico-sm')+'</div>'+
          '<div class="alert-body"><div class="alert-title">'+esc(a.codigo)+' — '+esc(a.cliente)+'</div>'+
          '<div class="alert-sub">Vence el '+fin+' · en '+dias+' días</div></div>'+
          '<button class="btn-primary btn-icon" onclick="closeModal();modalContrato(0,'+a.id+');" style="padding:5px 10px;">↻ Renovar</button>'+
        '</div>';
      }).join('');
    }
  }
  openModal('Alertas de Contratos', '<div style="margin:-20px;">'+body+'</div>', '<button class="btn-ghost" onclick="closeModal()">Cerrar</button>');
}

window.addEventListener('load',function(){if(loadSession()){showApp();startRefreshInterval();navTo('dashboard');cargarAlertas();setInterval(cargarAlertas,5*60*1000);}else{document.getElementById('loginOverlay').style.display='flex';document.getElementById('app').style.display='none';}});
</script>
