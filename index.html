<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StorageOS · EFI Logistics</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg-body:#0a1628;--bg-panel:#0f1f3a;--bg-elev:#152847;--bg-hover:#1e3560;
  --border:rgba(148,163,184,.12);--border-strong:rgba(148,163,184,.25);
  --brand:#10b981;--brand-dark:#059669;--accent:#3b82f6;--accent-dark:#2563eb;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --green:#10b981;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;--purple:#a855f7;--pink:#ec4899;
}
html,body{background:var(--bg-body);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;font-size:14px;}
input,select,textarea{background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:8px;color:var(--text);padding:10px 14px;font-size:13px;width:100%;outline:none;font-family:inherit;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.15);}
button{cursor:pointer;border:none;border-radius:8px;font-size:13px;font-weight:600;padding:10px 18px;transition:.15s;font-family:inherit;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-blue{background:var(--accent);color:#fff;}
.btn-blue:hover{background:var(--accent-dark);}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border-strong);}
.btn-ghost:hover{background:var(--bg-hover);color:var(--text);}
.btn-danger{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.3);}
.btn-danger:hover{background:rgba(239,68,68,.2);}
.btn-icon{padding:6px 10px;font-size:12px;}
label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);display:block;margin-bottom:6px;}

/* LOGIN */
#loginOverlay{position:fixed;inset:0;background:linear-gradient(135deg,#0a1628 0%,#0f1f3a 100%);display:flex;align-items:center;justify-content:center;z-index:9999;}
.login-box{background:var(--bg-panel);border:1px solid var(--border);border-radius:16px;padding:44px;width:420px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.login-box .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.login-box h1{font-size:24px;font-weight:800;color:var(--brand);}
.login-box h1 span{color:var(--text);}
.login-box p{font-size:12px;color:var(--text3);margin-bottom:32px;}
.login-box .field{margin-bottom:16px;}
.login-error{color:#ef4444;font-size:12px;margin-top:10px;display:none;}

/* HEADER TOP (EFI style) */
.topbar{background:var(--bg-panel);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;padding:0 24px;gap:24px;position:sticky;top:0;z-index:100;}
.topbrand{display:flex;align-items:center;gap:14px;}
.topbrand h1{font-size:20px;font-weight:800;color:var(--brand);}
.topbrand h1 span{color:var(--text);font-weight:600;}
.topbrand small{color:var(--text3);font-size:12px;}
.topsearch{flex:1;max-width:400px;position:relative;}
.topsearch input{padding:9px 14px 9px 40px;background:var(--bg-elev);}
.topsearch::before{content:'🔍';position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5;}
.topuser{display:flex;align-items:center;gap:10px;background:var(--bg-elev);padding:6px 14px 6px 6px;border-radius:10px;cursor:pointer;}
.topuser .avatar{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#10b981);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;}
.topuser .u-name{font-size:13px;font-weight:600;}
.topuser .u-rol{font-size:10px;color:var(--text3);text-transform:uppercase;}

/* TABS (EFI style) */
.tabs{background:var(--bg-panel);border-bottom:1px solid var(--border);display:flex;padding:0 24px;gap:2px;overflow-x:auto;}
.tab{padding:14px 18px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:.15s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--brand);border-bottom-color:var(--brand);}

/* MAIN */
.main{padding:28px 32px;max-width:1600px;margin:0 auto;}
.page-header{margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.page-title{font-size:22px;font-weight:700;margin-bottom:4px;}
.page-sub{font-size:13px;color:var(--text3);}

/* KPI CARDS (EFI style) */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:28px;}
.kpi{background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;padding:22px 24px;position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--brand);}
.kpi.blue::before{background:var(--blue);}
.kpi.red::before{background:var(--red);}
.kpi.yellow::before{background:var(--yellow);}
.kpi.purple::before{background:var(--purple);}
.kpi.pink::before{background:var(--pink);}
.kpi-icon{font-size:24px;margin-bottom:8px;opacity:.8;}
.kpi-val{font-size:32px;font-weight:800;margin-bottom:4px;color:var(--brand);letter-spacing:-.02em;}
.kpi.blue .kpi-val{color:var(--blue);}
.kpi.red .kpi-val{color:var(--red);}
.kpi.yellow .kpi-val{color:var(--yellow);}
.kpi.purple .kpi-val{color:var(--purple);}
.kpi.pink .kpi-val{color:var(--pink);}
.kpi-lbl{font-size:12px;color:var(--text2);font-weight:600;}

/* CARDS */
.card{background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px;}
.card-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.card-header h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card-header .count{font-size:12px;color:var(--text3);font-weight:500;}

/* TABLE */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead tr{background:rgba(255,255,255,.02);}
th{padding:12px 18px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text3);letter-spacing:.08em;white-space:nowrap;}
td{padding:13px 18px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
.actions{display:flex;gap:6px;justify-content:flex-end;}

/* BADGES */
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.badge-green{background:rgba(16,185,129,.15);color:#10b981;}
.badge-red{background:rgba(239,68,68,.15);color:#ef4444;}
.badge-blue{background:rgba(59,130,246,.15);color:#60a5fa;}
.badge-yellow{background:rgba(245,158,11,.15);color:#f59e0b;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(5,10,20,.85);backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg-panel);border:1px solid var(--border);border-radius:16px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.5);}
.modal-header{padding:22px 26px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-header h3{font-size:16px;font-weight:700;}
.modal-body{padding:26px;}
.modal-footer{padding:18px 26px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;}
.form-field{margin-bottom:14px;}

/* MISC */
.empty{padding:60px;text-align:center;color:var(--text3);font-size:13px;}
.loading{padding:60px;text-align:center;color:var(--text3);font-size:13px;}
.toast{position:fixed;bottom:28px;right:28px;background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:10px;padding:14px 20px;font-size:13px;z-index:9999;display:none;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.4);}
.toast.show{display:block;animation:slideUp .3s ease;}
.toast.success{border-color:rgba(16,185,129,.5);color:#10b981;}
.toast.error{border-color:rgba(239,68,68,.5);color:#ef4444;}
.toast.info{border-color:rgba(59,130,246,.5);color:#60a5fa;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.session-status{position:fixed;bottom:12px;left:16px;font-size:10px;color:var(--text3);z-index:100;opacity:.6;}

/* SUB-ROWS bodegas del contrato */
.linea-bod{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px;padding:10px;background:var(--bg-elev);border-radius:8px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginOverlay">
  <div class="login-box">
    <div class="brand">
      <h1>StorageOS<span> · Login</span></h1>
    </div>
    <p>Gestión de almacenes — EFI Logistics</p>
    <div class="field">
      <label>Correo electrónico</label>
      <input type="email" id="loginEmail" placeholder="usuario@empresa.com"/>
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="loginPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/>
    </div>
    <button class="btn-primary" style="width:100%;margin-top:8px;padding:12px;" onclick="login()">Ingresar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbrand">
      <h1>StorageOS <span>· Gestión Almacenes</span></h1>
    </div>
    <div class="topsearch"><input type="text" placeholder="Buscar..."/></div>
    <div class="topuser" onclick="logout()">
      <div class="avatar" id="uAvatar">W</div>
      <div>
        <div class="u-name" id="uName">Usuario</div>
        <div class="u-rol">Administrador</div>
      </div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <div class="tab active" data-page="dashboard" onclick="navTo('dashboard')">📊 Dashboard</div>
    <div class="tab" data-page="bodegas" onclick="navTo('bodegas')">🏭 Bodegas</div>
    <div class="tab" data-page="clientes" onclick="navTo('clientes')">👥 Clientes</div>
    <div class="tab" data-page="contratos" onclick="navTo('contratos')">📄 Contratos</div>
    <div class="tab" data-page="ocupaciones" onclick="navTo('ocupaciones')">📦 Ocupaciones</div>
  </div>

  <div class="main" id="mainArea"></div>
</div>

<div class="session-status" id="sessionStatus">✓ Sesión activa</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Modal</h3>
      <button class="btn-ghost btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// SUPABASE CONFIG
// ═══════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://zhmzjiozzdoutnqujbin.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpobXpqaW96emRvdXRucXVqYmluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNTU0NTMsImV4cCI6MjA5NzczMTQ1M30.r0ptqPhLTXO94CC1TDg23NAnAgsCb5UHj3gl917o8yk';

var _jwt = null, _refreshToken = null, _user = null;
var _refreshInterval = null, _isRefreshing = false, _refreshPromise = null;

// ═══════════════════════════════════════════════════════════════
// SESSION
// ═══════════════════════════════════════════════════════════════
function saveSession() {
  localStorage.setItem('_jwt', _jwt);
  localStorage.setItem('_refreshToken', _refreshToken);
  localStorage.setItem('_user', JSON.stringify(_user));
  updateSessionStatus(true);
}
function loadSession() {
  _jwt = localStorage.getItem('_jwt');
  _refreshToken = localStorage.getItem('_refreshToken');
  var s = localStorage.getItem('_user');
  if (s) { try { _user = JSON.parse(s); } catch(e) {} }
  return !!(_jwt && _refreshToken);
}
function clearSession() {
  _jwt = null; _refreshToken = null; _user = null;
  ['_jwt','_refreshToken','_user'].forEach(function(k){ localStorage.removeItem(k); });
  if (_refreshInterval) clearInterval(_refreshInterval);
  updateSessionStatus(false);
}
async function refreshToken() {
  if (!_refreshToken) return false;
  try {
    var res = await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{ 'apikey':SUPABASE_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ refresh_token:_refreshToken })
    });
    if (!res.ok) return false;
    var d = await res.json();
    if (d.access_token) {
      _jwt = d.access_token;
      if (d.refresh_token) _refreshToken = d.refresh_token;
      saveSession();
      console.log('✓ Token renovado');
      return true;
    }
  } catch(e) { console.error(e); }
  return false;
}
function startRefreshInterval() {
  if (_refreshInterval) clearInterval(_refreshInterval);
  _refreshInterval = setInterval(async function(){
    var ok = await refreshToken();
    if (!ok) { toast('Sesión expirada','error'); logout(); }
  }, 50*60*1000);
}
function updateSessionStatus(active) {
  var el = document.getElementById('sessionStatus');
  if (active) { el.textContent='✓ Sesión activa'; el.style.color='var(--green)'; }
  else { el.textContent='✗ Sin sesión'; el.style.color='var(--red)'; }
}

// ═══════════════════════════════════════════════════════════════
// FETCH
// ═══════════════════════════════════════════════════════════════
function sbh(extra) {
  var h = { 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+(_jwt||SUPABASE_KEY), 'Content-Type':'application/json' };
  if (extra) Object.assign(h, extra);
  return h;
}
async function sbFetch(path, opts, retry) {
  retry = retry || 0;
  var o = Object.assign({}, opts);
  o.headers = sbh(opts && opts.headers);
  var res = await fetch(SUPABASE_URL+path, o);
  if (res.status === 401 && retry < 2) {
    if (_isRefreshing) {
      await _refreshPromise;
      await new Promise(r=>setTimeout(r,500));
      return sbFetch(path, opts, retry+1);
    }
    _isRefreshing = true;
    _refreshPromise = refreshToken();
    var ok = await _refreshPromise;
    _isRefreshing = false;
    if (ok) {
      await new Promise(r=>setTimeout(r,300));
      o.headers = sbh(opts && opts.headers);
      res = await fetch(SUPABASE_URL+path, o);
    } else { logout(); return res; }
  }
  return res;
}

// ═══════════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════════
async function login() {
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPassword').value;
  var errEl = document.getElementById('loginError');
  errEl.style.display='none';
  if (!email || !pass) { errEl.textContent='Ingresá email y contraseña.'; errEl.style.display='block'; return; }
  try {
    var res = await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password', {
      method:'POST', headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({email,password:pass})
    });
    var d = await res.json();
    if (!res.ok || !d.access_token) throw new Error(d.error_description || d.msg || 'Error de autenticación');
    _jwt = d.access_token; _refreshToken = d.refresh_token; _user = d.user;
    saveSession();
    startRefreshInterval();
    showApp();
    toast('¡Sesión iniciada!','success');
    navTo('dashboard');
  } catch(e) { errEl.textContent=e.message; errEl.style.display='block'; }
}
function logout() {
  clearSession();
  document.getElementById('loginOverlay').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('loginEmail').value='';
  document.getElementById('loginPassword').value='';
}
function showApp() {
  document.getElementById('loginOverlay').style.display='none';
  document.getElementById('app').style.display='block';
  if (_user && _user.email) {
    var name = _user.email.split('@')[0];
    document.getElementById('uName').textContent = name;
    document.getElementById('uAvatar').textContent = name[0].toUpperCase();
  }
}

// ═══════════════════════════════════════════════════════════════
// NAV & UI HELPERS
// ═══════════════════════════════════════════════════════════════
function navTo(page) {
  document.querySelectorAll('.tab').forEach(function(t){ 
    t.classList.toggle('active', t.getAttribute('data-page')===page); 
  });
  var pages = { dashboard:renderDashboard, bodegas:renderBodegas, clientes:renderClientes, contratos:renderContratos, ocupaciones:renderOcupaciones };
  if (pages[page]) pages[page]();
}
function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || 'success');
  setTimeout(function(){ el.className='toast'; }, 3000);
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function openModal(title, body, footer) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalFooter').innerHTML = footer || '';
  document.getElementById('modalOverlay').classList.add('open');
}
function fmt(n) { return (parseFloat(n)||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtInt(n) { return Math.round(parseFloat(n)||0).toLocaleString('es-ES'); }
function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function confirmar(msg) {
  return new Promise(function(resolve){
    openModal('Confirmar', '<p style="color:var(--text2);line-height:1.6;">'+esc(msg)+'</p>',
      '<button class="btn-ghost" onclick="closeModal();window._confRes(false);">Cancelar</button>'+
      '<button class="btn-danger" onclick="closeModal();window._confRes(true);">Eliminar</button>');
    window._confRes = resolve;
  });
}

// ═══════════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════════
async function renderDashboard() {
  document.getElementById('mainArea').innerHTML = '<div class="loading">Cargando dashboard...</div>';
  try {
    var [rB, rCB, rCli, rCon] = await Promise.all([
      sbFetch('/rest/v1/bodegas?select=*&order=nombre.asc'),
      sbFetch('/rest/v1/contrato_bodegas?select=*,contratos(activo)&order=id.asc'),
      sbFetch('/rest/v1/clientes_almacen?select=id&limit=1', {headers:{'Prefer':'count=exact','Range':'0-0'}}),
      sbFetch('/rest/v1/contratos?select=id&activo=eq.true&limit=1', {headers:{'Prefer':'count=exact','Range':'0-0'}})
    ]);
    var bodegas = await rB.json(); if (!Array.isArray(bodegas)) bodegas=[];
    var cb = await rCB.json(); if (!Array.isArray(cb)) cb=[];
    var cliHdr = rCli.headers.get('Content-Range'); var totalCli = cliHdr ? parseInt(cliHdr.split('/')[1])||0 : 0;
    var conHdr = rCon.headers.get('Content-Range'); var totalCon = conHdr ? parseInt(conHdr.split('/')[1])||0 : 0;

    var bodMap = {}; bodegas.forEach(function(b){ bodMap[b.id]=b; });
    var totalMts2 = bodegas.reduce(function(a,b){ return a+parseFloat(b.mts2_totales||0); }, 0);
    var activosCB = cb.filter(function(r){ return r.contratos && r.contratos.activo; });
    var mts2Util = activosCB.reduce(function(a,r){ return a+parseFloat(r.mts2||0); }, 0);
    var mts2Disp = totalMts2 - mts2Util;
    var valAlq = activosCB.reduce(function(a,r){ var b=bodMap[r.bodega_id]; return a+(parseFloat(r.mts2||0)*(b?parseFloat(b.valor_m2_alquiler||0):0)); }, 0);
    var valVta = activosCB.reduce(function(a,r){ return a+(parseFloat(r.mts2||0)*parseFloat(r.valor_m2||0)); }, 0);
    var utilidad = valVta - valAlq;
    var ocupPct = totalMts2 > 0 ? Math.round((mts2Util/totalMts2)*100) : 0;

    document.getElementById('mainArea').innerHTML =
      '<div class="page-header">'+
        '<div><div class="page-title">📊 Dashboard</div>'+
        '<div class="page-sub">Resumen general de ocupación, ingresos y rentabilidad</div></div>'+
      '</div>'+
      '<div class="kpi-grid">'+
        '<div class="kpi blue"><div class="kpi-icon">📐</div><div class="kpi-val">'+fmtInt(totalMts2)+' m²</div><div class="kpi-lbl">Total M² Almacenes</div></div>'+
        '<div class="kpi purple"><div class="kpi-icon">📦</div><div class="kpi-val">'+fmtInt(mts2Util)+' m²</div><div class="kpi-lbl">M² Utilizados</div></div>'+
        '<div class="kpi"><div class="kpi-icon">✅</div><div class="kpi-val">'+fmtInt(mts2Disp)+' m²</div><div class="kpi-lbl">M² Disponibles</div></div>'+

        bodegas.map(function(b){
          var util = activosCB.filter(function(r){ return r.bodega_id===b.id; }).reduce(function(a,r){ return a+parseFloat(r.mts2||0); }, 0);

          var pct = tot > 0 ? Math.round((util/tot)*100) : 0;

async function modalContrato(id) {
  var c = { codigo:'', cliente_id:null, fecha_inicio:'', fecha_fin:'', activo:true, observaciones:'' };

  var [rCli, rBod] = await Promise.all([
    sbFetch('/rest/v1/clientes_almacen?select=id,codigo,razon_social&order=razon_social.asc'),

  ]);
  var clientes = await rCli.json(); if (!Array.isArray(clientes)) clientes=[];
  var bodegas = await rBod.json(); if (!Array.isArray(bodegas)) bodegas=[];
  if (id) {
    var [r1, r2] = await Promise.all([
      sbFetch('/rest/v1/contratos?id=eq.'+id),
      sbFetch('/rest/v1/contrato_bodegas?contrato_id=eq.'+id)
    ]);
    var d1 = await r1.json(); if (d1 && d1[0]) c = d1[0];
    var d2 = await r2.json(); if (Array.isArray(d2)) lineas = d2.map(function(l){ return {id:l.id,bodega_id:l.bodega_id,mts2:l.mts2,valor_m2:l.valor_m2}; });
  } else {
    var rAll = await sbFetch('/rest/v1/contratos?select=codigo&order=codigo.desc&limit=1');
    var da = await rAll.json();
    var next = 1;
    if (da && da[0] && da[0].codigo) { var m = da[0].codigo.match(/(\d+)/); if (m) next = parseInt(m[1])+1; }
    c.codigo = 'CONT-'+String(next).padStart(5,'0');
  }
  window._modLin = lineas;
  window._modBod = bodegas;
  var optsC = clientes.map(function(x){ return '<option value="'+x.id+'"'+(c.cliente_id===x.id?' selected':'')+'>'+esc(x.codigo+' — '+x.razon_social)+'</option>'; }).join('');
  openModal(id?'Editar Contrato':'Nuevo Contrato',

      '<div><label>Código *</label><input id="ctCod" value="'+esc(c.codigo)+'"/></div>'+
      '<div><label>Estado</label><select id="ctAct"><option value="true"'+(c.activo?' selected':'')+'>Activo</option><option value="false"'+(!c.activo?' selected':'')+'>Inactivo</option></select></div>'+
    '</div>'+
    '<div class="form-field"><label>Cliente *</label><select id="ctCli"><option value="">— Seleccionar —</option>'+optsC+'</select></div>'+
    '<div class="form-row">'+
      '<div><label>Fecha Inicio</label><input id="ctIni" type="date" value="'+(c.fecha_inicio||'')+'"/></div>'+
      '<div><label>Fecha Fin</label><input id="ctFin" type="date" value="'+(c.fecha_fin||'')+'"/></div>'+
    '</div>'+
    '<div class="form-field"><label>Observaciones</label><textarea id="ctObs" rows="2">'+esc(c.observaciones||'')+'</textarea></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px;">'+
      '<label style="margin:0;">Bodegas asignadas</label>'+
      '<button class="btn-blue btn-icon" onclick="_agregarLin()">+ Agregar bodega</button>'+
    '</div>'+
    '<div id="lineasBod"></div>',
    '<button class="btn-ghost" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn-primary" onclick="guardarContrato('+(id||0)+')">Guardar</button>');
  _renderLin();
}
function _renderLin() {
  var el = document.getElementById('lineasBod');
  if (!el) return;
  var lin = window._modLin || [];
  var bod = window._modBod || [];
  if (lin.length === 0) { el.innerHTML = '<div style="padding:16px;color:var(--text3);font-size:12px;text-align:center;background:var(--bg-elev);border-radius:8px;">Sin bodegas. Clic en "Agregar bodega".</div>'; return; }
  el.innerHTML = lin.map(function(l,i){
    var opts = bod.map(function(b){ return '<option value="'+b.id+'"'+(l.bodega_id===b.id?' selected':'')+'>'+esc(b.nombre)+'</option>'; }).join('');
    return '<div class="linea-bod">'+
      '<div><label>Bodega</label><select data-i="'+i+'" data-f="bodega_id" onchange="_updLin(this)"><option value="">—</option>'+opts+'</select></div>'+
      '<div><label>M²</label><input type="number" step="0.01" value="'+(l.mts2||0)+'" data-i="'+i+'" data-f="mts2" onchange="_updLin(this)"/></div>'+
      '<div><label>$/m²</label><input type="number" step="0.01" value="'+(l.valor_m2||0)+'" data-i="'+i+'" data-f="valor_m2" onchange="_updLin(this)"/></div>'+
      '<div><button class="btn-danger btn-icon" onclick="_delLin('+i+')">✕</button></div>'+
    '</div>';
  }).join('');
}
function _updLin(el) {
  var i = parseInt(el.getAttribute('data-i'));
  var f = el.getAttribute('data-f');
  var v = f==='bodega_id' ? (parseInt(el.value)||null) : (parseFloat(el.value)||0);
  if (window._modLin && window._modLin[i]) window._modLin[i][f] = v;
}
function _agregarLin() {
  if (!window._modLin) window._modLin = [];
  window._modLin.push({ id:null, bodega_id:null, mts2:0, valor_m2:0 });
  _renderLin();
}
function _delLin(i) {
  if (window._modLin) window._modLin.splice(i,1);
  _renderLin();
}
async function guardarContrato(id) {
  var rec = {
    codigo: document.getElementById('ctCod').value.trim(),
    cliente_id: parseInt(document.getElementById('ctCli').value)||null,
    fecha_inicio: document.getElementById('ctIni').value || null,
    fecha_fin: document.getElementById('ctFin').value || null,
    observaciones: document.getElementById('ctObs').value.trim() || null,
    activo: document.getElementById('ctAct').value === 'true'
  };
  var lineas = (window._modLin||[]).filter(function(l){ return l.bodega_id && l.mts2 > 0; });
  if (!rec.codigo || !rec.cliente_id) { toast('Código y Cliente son requeridos','error'); return; }
  if (lineas.length === 0) { toast('Agregá al menos una bodega','error'); return; }
  var res = await sbFetch('/rest/v1/contratos'+(id?'?id=eq.'+id:''), {
    method: id?'PATCH':'POST',
    headers: {'Prefer':'return=representation'},
    body: JSON.stringify(rec)
  });
  if (!res.ok) { var e=await res.json(); toast('Error: '+(e.message||res.status),'error'); return; }
  var saved = await res.json();
  var contId = id || (Array.isArray(saved) ? saved[0].id : saved.id);
  if (id) await sbFetch('/rest/v1/contrato_bodegas?contrato_id=eq.'+contId, {method:'DELETE'});
  var inserts = lineas.map(function(l){ return { contrato_id:contId, bodega_id:l.bodega_id, mts2:l.mts2, valor_m2:l.valor_m2 }; });
  var rIns = await sbFetch('/rest/v1/contrato_bodegas', {method:'POST', body:JSON.stringify(inserts)});
  if (!rIns.ok) { var e2=await rIns.json(); toast('Error bodegas: '+(e2.message||rIns.status),'error'); return; }
  toast(id?'Contrato actualizado':'Contrato creado');
  closeModal(); renderContratos();
}
async function eliminarContrato(id) {
  if (!(await confirmar('¿Eliminar este contrato y sus bodegas asignadas?'))) return;
  await sbFetch('/rest/v1/contrato_bodegas?contrato_id=eq.'+id, {method:'DELETE'});
  var res = await sbFetch('/rest/v1/contratos?id=eq.'+id, {method:'DELETE'});
  if (!res.ok) { toast('Error al eliminar','error'); return; }
  toast('Contrato eliminado'); renderContratos();
}

// ═══════════════════════════════════════════════════════════════
// OCUPACIONES — CRUD
// ═══════════════════════════════════════════════════════════════
async function renderOcupaciones() {
  document.getElementById('mainArea').innerHTML = '<div class="loading">Cargando ocupaciones...</div>';
  try {
    var res = await sbFetch('/rest/v1/ocupaciones?select=*,contratos(codigo,clientes_almacen(razon_social))&order=semana.desc&limit=200');
    var ocs = await res.json();
    if (!Array.isArray(ocs)) ocs = [];
    document.getElementById('mainArea').innerHTML =
      '<div class="page-header">'+
        '<div><div class="page-title">📦 Ocupaciones</div>'+
        '<div class="page-sub">Registro semanal de m² ocupados por contrato</div></div>'+
        '<button class="btn-primary" onclick="modalOcupacion()">+ Registrar ocupación</button>'+
      '</div>'+
      '<div class="card">'+
        '<div class="card-header"><h3>Últimos Registros</h3><span class="count">'+ocs.length+' registros</span></div>'+
        '<div class="table-wrap"><table><thead><tr><th>Semana</th><th>Contrato</th><th>Cliente</th><th>M² Ocupados</th><th style="text-align:right;">Acciones</th></tr></thead><tbody>'+
        (ocs.length===0 ? '<tr><td colspan="5" class="empty">Sin registros de ocupación</td></tr>' :
        ocs.map(function(o){
          var ct = o.contratos || {};
          var cli = ct.clientes_almacen ? ct.clientes_almacen.razon_social : '—';
          var sem = o.semana ? new Date(o.semana).toLocaleDateString('es-ES') : '—';
          return '<tr><td>'+sem+'</td>'+
            '<td><strong>'+esc(ct.codigo||'—')+'</strong></td>'+
            '<td>'+esc(cli)+'</td>'+
            '<td>'+fmtInt(o.mts2_ocupados||0)+' m²</td>'+
            '<td><div class="actions">'+
              '<button class="btn-ghost btn-icon" onclick="modalOcupacion('+o.id+')">✏️</button>'+
              '<button class="btn-danger btn-icon" onclick="eliminarOcupacion('+o.id+')">🗑️</button>'+
            '</div></td></tr>';
        }).join(''))+
        '</tbody></table></div></div>';
  } catch(e) {
    toast('Error: '+e.message,'error');
    document.getElementById('mainArea').innerHTML='<div class="empty">Error cargando datos</div>';
  }
}
async function modalOcupacion(id) {
  var o = { contrato_id:null, semana:new Date().toISOString().split('T')[0], mts2_ocupados:0 };
  if (id) {
    var res = await sbFetch('/rest/v1/ocupaciones?id=eq.'+id);
    var d = await res.json();
    if (d && d[0]) o = d[0];
  }
  var rC = await sbFetch('/rest/v1/contratos?select=id,codigo,clientes_almacen(razon_social)&activo=eq.true&order=codigo.asc');
  var conts = await rC.json(); if (!Array.isArray(conts)) conts=[];
  var opts = conts.map(function(c){
    var cli = c.clientes_almacen ? ' — '+c.clientes_almacen.razon_social : '';
    return '<option value="'+c.id+'"'+(o.contrato_id===c.id?' selected':'')+'>'+esc(c.codigo+cli)+'</option>';
  }).join('');
  openModal(id?'Editar Ocupación':'Registrar Ocupación',
    '<div class="form-field"><label>Contrato *</label><select id="oCont"><option value="">— Seleccionar —</option>'+opts+'</select></div>'+
    '<div class="form-row">'+
      '<div><label>Semana (fecha lunes) *</label><input id="oSem" type="date" value="'+(o.semana||'')+'"/></div>'+
      '<div><label>M² Ocupados *</label><input id="oMts" type="number" step="0.01" value="'+(o.mts2_ocupados||0)+'"/></div>'+
    '</div>',
    '<button class="btn-ghost" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn-primary" onclick="guardarOcupacion('+(id||0)+')">Guardar</button>');
}
async function guardarOcupacion(id) {
  var rec = {
    contrato_id: parseInt(document.getElementById('oCont').value)||null,
    semana: document.getElementById('oSem').value || null,
    mts2_ocupados: parseFloat(document.getElementById('oMts').value)||0
  };
  if (!rec.contrato_id || !rec.semana || !rec.mts2_ocupados) { toast('Todos los campos son requeridos','error'); return; }
  var res = await sbFetch('/rest/v1/ocupaciones'+(id?'?id=eq.'+id:''), {
    method: id?'PATCH':'POST',
    headers: {'Prefer':'return=representation'},
    body: JSON.stringify(rec)
  });
  if (!res.ok) { var e=await res.json(); toast('Error: '+(e.message||e.hint||res.status),'error'); return; }
  toast(id?'Ocupación actualizada':'Ocupación registrada');
  closeModal(); renderOcupaciones();
}
async function eliminarOcupacion(id) {
  if (!(await confirmar('¿Eliminar este registro de ocupación?'))) return;
  var res = await sbFetch('/rest/v1/ocupaciones?id=eq.'+id, {method:'DELETE'});
  if (!res.ok) { toast('Error al eliminar','error'); return; }
  toast('Ocupación eliminada'); renderOcupaciones();
}
