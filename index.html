<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StorageOS — Gestión de Almacenes</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg1:#0f1117;--bg2:#1a1d27;--bg3:#22263a;
      --border:rgba(255,255,255,.08);
      --accent:#3b82f6;--accent2:#60a5fa;
      --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
      --green:#22c55e;--red:#ef4444;--yellow:#f59e0b;
    }
    body{background:var(--bg1);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
    input,select,textarea{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 12px;font-size:13px;width:100%;outline:none;}
    input:focus,select:focus{border-color:var(--accent);}
    button{cursor:pointer;border:none;border-radius:8px;font-size:13px;font-weight:600;padding:9px 18px;transition:.15s;}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-primary:hover{background:var(--accent2);}
    .btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border);}
    .btn-ghost:hover{background:var(--bg3);}
    .btn-danger{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.3);}
    label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);display:block;margin-bottom:5px;}

    /* Login */
    #loginOverlay{position:fixed;inset:0;background:var(--bg1);display:flex;align-items:center;justify-content:center;z-index:9999;}
    .login-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:40px;width:380px;}
    .login-box h1{font-size:22px;font-weight:800;color:var(--accent);margin-bottom:4px;}
    .login-box p{font-size:12px;color:var(--text3);margin-bottom:28px;}
    .login-box .field{margin-bottom:16px;}
    .login-error{color:#ef4444;font-size:12px;margin-top:8px;display:none;}

    /* Shell */
    .shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
    .sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:20px 0;display:flex;flex-direction:column;}
    .sidebar-logo{padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:12px;}
    .sidebar-logo span{font-size:16px;font-weight:800;color:var(--accent);}
    .sidebar-logo small{display:block;font-size:10px;color:var(--text3);margin-top:2px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13px;color:var(--text2);cursor:pointer;border-left:3px solid transparent;transition:.15s;}
    .nav-item:hover{background:var(--bg3);color:var(--text);}
    .nav-item.active{background:rgba(59,130,246,.1);color:var(--accent);border-left-color:var(--accent);}
    .nav-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);padding:16px 20px 6px;}
    .main{padding:28px;overflow-y:auto;}
    .page-title{font-size:20px;font-weight:700;margin-bottom:4px;}
    .page-sub{font-size:13px;color:var(--text3);margin-bottom:24px;}

    /* Cards */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px;}
    .kpi{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;}
    .kpi-val{font-size:28px;font-weight:800;margin-bottom:4px;}
    .kpi-lbl{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;}

    /* Table */
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px;}
    .card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    .card-header h3{font-size:14px;font-weight:600;}
    table{width:100%;border-collapse:collapse;}
    thead tr{background:rgba(255,255,255,.03);}
    th{padding:10px 16px;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;color:var(--text3);letter-spacing:.06em;}
    td{padding:11px 16px;font-size:13px;border-bottom:1px solid var(--border);}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:rgba(255,255,255,.02);}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(10,15,35,.85);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
    .modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    .modal-header h3{font-size:15px;font-weight:700;}
    .modal-body{padding:24px;}
    .modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
    .form-field{margin-bottom:14px;}

    /* Badge */
    .badge{display:inline-block;padding:2px 9px;border-radius:5px;font-size:10px;font-weight:700;}
    .badge-green{background:rgba(34,197,94,.15);color:#22c55e;}
    .badge-red{background:rgba(239,68,68,.15);color:#ef4444;}
    .badge-yellow{background:rgba(245,158,11,.15);color:#f59e0b;}
    .badge-blue{background:rgba(59,130,246,.15);color:#60a5fa;}

    .empty{padding:48px;text-align:center;color:var(--text3);}
    .loading{padding:48px;text-align:center;color:var(--text3);}
    .toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13px;z-index:9999;display:none;max-width:340px;}
    .toast.show{display:block;}
    .toast.success{border-color:rgba(34,197,94,.4);color:#22c55e;}
    .toast.error{border-color:rgba(239,68,68,.4);color:#ef4444;}
    .toast.info{border-color:rgba(59,130,246,.4);color:#60a5fa;}
    
    /* Status indicator */
    .session-status{position:fixed;bottom:24px;left:24px;font-size:11px;color:var(--text3);z-index:100;}
  </style>
</head>
<body>

<!-- Login -->
<div id="loginOverlay">
  <div class="login-box">
    <h1>StorageOS</h1>
    <p>Gestión de almacenes · EFI Logistics</p>
    <div class="field">
      <label>Correo electrónico</label>
      <input type="email" id="loginEmail" placeholder="usuario@empresa.com"/>
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="loginPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/>
    </div>
    <button class="btn-primary" style="width:100%;margin-top:8px;" onclick="login()">Ingresar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- Shell -->
<div class="shell" id="shell" style="display:none;">
  <div class="sidebar">
    <div class="sidebar-logo">
      <span>StorageOS</span>
      <small>Gestión de almacenes</small>
    </div>
    <div class="nav-section">Principal</div>
    <div class="nav-item active" onclick="navTo('dashboard')">📊 Dashboard</div>
    <div class="nav-section">Catálogo</div>
    <div class="nav-item" onclick="navTo('bodegas')">🏭 Bodegas</div>
    <div class="nav-item" onclick="navTo('clientes')">👥 Clientes</div>
    <div class="nav-item" onclick="navTo('contratos')">📄 Contratos</div>
    <div class="nav-section">Operaciones</div>
    <div class="nav-item" onclick="navTo('ocupaciones')">📦 Ocupaciones</div>
    <div style="flex:1;"></div>
    <div class="nav-item" onclick="logout()" style="color:var(--text3);">🚪 Cerrar sesión</div>
  </div>
  <div class="main" id="mainArea"></div>
</div>

<div class="session-status" id="sessionStatus">✓ Sesión activa</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Modal</h3>
      <button class="btn-ghost" style="padding:4px 10px;" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zhmzjiozzdoutnqujbin.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpobXpqaW96emRvdXRucXVqYmluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNTU0NTMsImV4cCI6MjA5NzczMTQ1M30.r0ptqPhLTXO94CC1TDg23NAnAgsCb5UHj3gl917o8yk';

var _jwt = null;
var _refreshToken = null;
var _user = null;
var _refreshInterval = null;
var _isRefreshing = false;
var _refreshPromise = null;

function saveSession() {
  localStorage.setItem('_jwt', _jwt);
  localStorage.setItem('_refreshToken', _refreshToken);
  localStorage.setItem('_user', JSON.stringify(_user));
  updateSessionStatus(true);
}

function loadSession() {
  _jwt = localStorage.getItem('_jwt');
  _refreshToken = localStorage.getItem('_refreshToken');
  var userStr = localStorage.getItem('_user');
  if (userStr) {
    try { _user = JSON.parse(userStr); } catch(e) { _user = null; }
  }
  return !!(_jwt && _refreshToken);
}

function clearSession() {
  _jwt = null;
  _refreshToken = null;
  _user = null;
  localStorage.removeItem('_jwt');
  localStorage.removeItem('_refreshToken');
  localStorage.removeItem('_user');
  if (_refreshInterval) clearInterval(_refreshInterval);
  updateSessionStatus(false);
}

async function refreshToken() {
  if (!_refreshToken) return false;
  try {
    var res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: _refreshToken })
    });
    if (!res.ok) {
      console.warn('Token refresh falló, requiere nuevo login');
      return false;
    }
    var data = await res.json();
    if (data.access_token) {
      _jwt = data.access_token;
      if (data.refresh_token) _refreshToken = data.refresh_token;
      saveSession();
      console.log('✓ Token renovado automáticamente');
      return true;
    }
  } catch(e) {
    console.error('Error al renovar token:', e);
  }
  return false;
}

function startRefreshInterval() {
  if (_refreshInterval) clearInterval(_refreshInterval);
  _refreshInterval = setInterval(async function() {
    var ok = await refreshToken();
    if (!ok) {
      toast('Tu sesión expiró. Por favor inicia sesión nuevamente.', 'error');
      logout();
    }
  }, 50 * 60 * 1000);
}

function updateSessionStatus(isActive) {
  var el = document.getElementById('sessionStatus');
  if (isActive) {
    el.textContent = '✓ Sesión activa';
    el.style.color = 'var(--green)';
  } else {
    el.textContent = '✗ Sin sesión';
    el.style.color = 'var(--red)';
  }
}

function sbh(extra) {
  var h = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (_jwt || SUPABASE_KEY), 'Content-Type': 'application/json' };
  if (extra) Object.assign(h, extra);
  return h;
}

async function sbFetch(path, opts, retryCount) {
  retryCount = retryCount || 0;
  var options = Object.assign({}, opts);
  options.headers = sbh(opts && opts.headers);
  var res = await fetch(SUPABASE_URL + path, options);
  
  if (res.status === 401 && retryCount < 2) {
    if (_isRefreshing) {
      await _refreshPromise;
      await new Promise(r => setTimeout(r, 500));
      return sbFetch(path, opts, retryCount + 1);
    }
    
    _isRefreshing = true;
    _refreshPromise = refreshToken();
    var ok = await _refreshPromise;
    _isRefreshing = false;
    
    if (ok) {
      await new Promise(r => setTimeout(r, 300));
      options.headers = sbh(opts && opts.headers);
      res = await fetch(SUPABASE_URL + path, options);
    } else {
      logout();
      return res;
    }
  }
  return res;
}

async function login() {
  var email = document.getElementById('loginEmail').value.trim();
  var pass  = document.getElementById('loginPassword').value;
  var errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  if (!email || !pass) { errEl.textContent = 'Ingresá email y contraseña.'; errEl.style.display = 'block'; return; }
  try {
    var res  = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    });
    var data = await res.json();
    if (!res.ok || !data.access_token) throw new Error(data.error_description || data.msg || 'Error de autenticación');
    _jwt  = data.access_token;
    _refreshToken = data.refresh_token;
    _user = data.user;
    
    saveSession();
    startRefreshInterval();
    
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('shell').style.display = 'grid';
    toast('¡Sesión iniciada correctamente!', 'success');
    navTo('dashboard');
  } catch(e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
}

function logout() {
  clearSession();
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('shell').style.display = 'none';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
  toast('Sesión cerrada', 'info');
}

function navTo(page) {
  document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.remove('active'); });
  var items = document.querySelectorAll('.nav-item');
  items.forEach(function(el){ if (el.textContent.toLowerCase().includes(page) || el.getAttribute('onclick')&&el.getAttribute('onclick').includes(page)) el.classList.add('active'); });
  var pages = { dashboard: renderDashboard, bodegas: renderBodegas, clientes: renderClientes, contratos: renderContratos, ocupaciones: renderOcupaciones };
  if (pages[page]) pages[page]();
}

function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || 'success');
  setTimeout(function(){ el.className = 'toast'; }, 3000);
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

function openModal(title, bodyHtml, footerHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = footerHtml || '';
  document.getElementById('modalOverlay').classList.add('open');
}

function fmt(n) { return (n||0).toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtInt(n) { return (n||0).toLocaleString('es-ES'); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function renderDashboard() {
  document.getElementById('mainArea').innerHTML = '<div class="loading">Cargando dashboard...</div>';
  try {
    var [resBod, resContBod] = await Promise.all([
      sbFetch('/rest/v1/bodegas?select=*&order=nombre.asc'),
      sbFetch('/rest/v1/contrato_bodegas?select=*,contratos(activo)&order=id.asc')
    ]);
    
    var bodegas = await resBod.json();
    var contratoBodegas = await resContBod.json();
    
    if (!Array.isArray(bodegas)) bodegas = [];
    if (!Array.isArray(contratoBodegas)) contratoBodegas = [];

    var totalMts2 = bodegas.reduce(function(a,b){ return a+(b.mts2_totales||0); }, 0);
    var activosCB = contratoBodegas.filter(function(r){ return r.contratos && r.contratos.activo; });
    var mts2Utilizados = activosCB.reduce(function(a,r){ return a+(r.mts2||0); }, 0);
    var mts2Disponibles = totalMts2 - mts2Utilizados;
    var valorAlquilerTotal = activosCB.reduce(function(a,r){ return a+((r.mts2||0)*(r.valor_m2||0)); }, 0);
    var valorVentaTotal = activosCB.reduce(function(a,r){ return a+((r.mts2||0)*(r.valor_venta||r.valor_m2||0)); }, 0);
    var ocupPct = totalMts2 > 0 ? Math.round((mts2Utilizados/totalMts2)*100) : 0;

    document.getElementById('mainArea').innerHTML =
      '<div class="page-title">📊 Dashboard</div>' +
      '<div class="page-sub">Resumen general de ocupación, ingresos y disponibilidad</div>' +
      '<div class="kpi-grid">' +
        '<div class="kpi"><div class="kpi-val">' + fmtInt(totalMts2) + '</div><div class="kpi-lbl">Total M²</div></div>' +
        '<div class="kpi"><div class="kpi-val">' + fmtInt(mts2Utilizados) + '</div><div class="kpi-lbl">M² Utilizados</div></div>' +
        '<div class="kpi"><div class="kpi-val">$' + fmt(valorAlquilerTotal) + '</div><div class="kpi-lbl">Valor Alquiler</div></div>' +
        '<div class="kpi"><div class="kpi-val">$' + fmt(valorVentaTotal) + '</div><div class="kpi-lbl">Valor Venta</div></div>' +
        '<div class="kpi"><div class="kpi-val">' + fmtInt(mts2Disponibles) + '</div><div class="kpi-lbl">M² Disponibles</div></div>' +
        '<div class="kpi"><div class="kpi-val">' + ocupPct + '%</div><div class="kpi-lbl">Ocupación</div></div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-header"><h3>Ocupación por Bodega</h3></div>' +
        '<table><thead><tr><th>Bodega</th><th>Total M²</th><th>Utilizados</th><th>Disponibles</th><th>%</th></tr></thead><tbody>' +
        bodegas.map(function(b){
          var utilizados = activosCB.filter(function(r){ return r.bodega_id===b.id; }).reduce(function(a,r){ return a+(r.mts2||0); }, 0);
          var disponibles = (b.mts2_totales||0) - utilizados;
          var pct = (b.mts2_totales||0) > 0 ? Math.round((utilizados/(b.mts2_totales||0))*100) : 0;
          return '<tr><td><strong>' + esc(b.nombre) + '</strong></td><td>' + fmtInt(b.mts2_totales||0) + ' m²</td><td>' + fmtInt(utilizados) + ' m²</td><td>' + fmtInt(disponibles) + ' m²</td><td>' + pct + '%</td></tr>';
        }).join('') +
        '</tbody></table></div>';
  } catch(e) {
    toast('Error al cargar dashboard: ' + e.message, 'error');
    document.getElementById('mainArea').innerHTML = '<div class="empty">Error cargando datos</div>';
  }
}

async function renderBodegas() { document.getElementById('mainArea').innerHTML = '<div class="page-title">🏭 Bodegas</div><div class="loading">En desarrollo...</div>'; }
async function renderClientes() { document.getElementById('mainArea').innerHTML = '<div class="page-title">👥 Clientes</div><div class="loading">En desarrollo...</div>'; }
async function renderContratos() { document.getElementById('mainArea').innerHTML = '<div class="page-title">📄 Contratos</div><div class="loading">En desarrollo...</div>'; }
async function renderOcupaciones() { document.getElementById('mainArea').innerHTML = '<div class="page-title">📦 Ocupaciones</div><div class="loading">En desarrollo...</div>'; }

window.addEventListener('load', function() {
  if (loadSession()) {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('shell').style.display = 'grid';
    startRefreshInterval();
    navTo('dashboard');
  } else {
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('shell').style.display = 'none';
  }
});

</script>
</body>
</html>
